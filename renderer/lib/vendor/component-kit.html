        const offsetLabel = svgNode('text', { x: sharedRow ? ox - 10 : ox + (heightRatio < 1 ? 18 : -18), y: offsetY, 'text-anchor': sharedRow ? 'middle' : heightRatio < 1 ? 'start' : 'end', 'data-geometry-measure': 'offset' }, heightRatio > 1 ? 'h − r' : 'r − h');

      if (x * scale > 76) {

      input.setAttribute('aria-valuetext', `高度${measure(h).spoken}${unit}，h/r为${measure(heightRatio).spoken}`);

      for (const [key, value] of Object.entries({ height: h, halfBase: x, base: 2 * x, area })) { const cell = cells.get(key); cell.dataset.value = String(value); cell.textContent = `${measure(value).equation} ${unit}${key === 'area' ? '²' : ''}`; }

    input.addEventListener('change', () => {
      persist();
    });
    precise.addEventListener('input', () => {
      const value = precise.valueAsNumber;

  // chatui:renderer geometry end
  try {
    config = JSON.parse(configNode.textContent);
    require(config && config.schemaVersion === 1 && typeof config.contentId === 'string' && config.contentId.length > 0, '配置需要 schemaVersion: 1 和内容标识。');
    require(config.data && typeof config.data === 'object', '配置需要组件数据。');
    identity = config.contentId + ':' + fingerprint(config);
    const renderers = { progress, timeline, profile, comparison, steps: data => timeline(data, true), rhythm, quiz, geometry, answer, 'line-chart': lineChart, 'force-diagram': forceDiagram, 'motion-lab': motionLab, 'media-panel': mediaPanel, 'data-table': dataTable, 'tabs': tabs, 'reveal-steps': revealSteps, 'input-form': inputForm };
    require(Object.hasOwn(renderers, config.type), '不支持的组件类型。');
    renderers[config.type](config.data);
    window.addEventListener('openai:set_globals', event => {
      activeHostRefresh?.();
      const candidate = event.detail?.globals?.widgetState;

      const saved = stateEnvelope(candidate);
      if (saved !== null) activeRestore(saved);

    if (resizeObserver) resizeObserver.disconnect();
    root.replaceChildren();
    const message = el('p', 'cui-error', '组件未显示：' + (error instanceof Error ? error.message : '请检查配置。'));
    message.setAttribute('role', 'alert'); root.append(message);
  }
})();
