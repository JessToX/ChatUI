/r=1；重新载入时可能恢复本地已保存的真实操作。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"04 · 边界与自检"}]},{"type":"paragraph","children":[{"type":"text","text":"解析端点 h=0 和 h=2r 都是退化三角形，面积为零。现有滑块只覆盖 0.05≤h/r≤1.95，两个端点不在实验范围内；不要把滑块最左或最右的位置当成退化端点。"}]},{"type":"paragraph","children":[{"type":"text","text":"长度以 cm 计，面积以 cm² 计。固定半径不变时，改变高度会同时改变底边。当前图形与最优图形不同，表示你正在比较不同状态，并不推翻极值推导。"}]}]}],"viewVersion":1,"mode":"document","documentVersion":1,"sourceHash":"f9e9c88620ed781a","callouts":{}},"text":"# 圆内的三角形，什么时候面积最大？\n\n半径固定，三角形越高，底边却未必越宽。先从几何关系找到面积的最大值，再用下面的实验检查自己的直觉。\n\n\n## 01 · 题设与变量\n取半径 r=2 cm 的圆，顶点 A 固定在圆的最上方，底边 BC 平行于水平直径，三个顶点都在圆上。三角形的高记为 h，底边长为 b。这里只讨论非退化三角形，定义域是 \\(0\u003ch\u003c2r\\)。圆心到底边的有向距离为 r−h；它可以为负，长度关系仍由平方给出。\n\n\n\\[x=\\frac b2=\\sqrt{r^2-(r-h)^2}=\\sqrt{2rh-h^2}\\]\n这里 x 是半底边，不是整个底边。面积中的二分之一与底边的系数二相消，因此 A(h)=h√(2rh−h²)，而不是再乘一个二。\n\n\n## 02 · 固定推导：寻找最优高度\n在定义域内根号为正，求导得到：\n\n\n\\[A'(h)=\\frac{h(3r-2h)}{\\sqrt{2rh-h^2}}\\]\n由于 h\u003e0，导数的符号由 3r−2h 决定。高度小于 3r/2 时面积递增，大于 3r/2 时面积递减；两端的极限面积都是零，所以唯一最大值出现在 h/r=1.5。\n\n\n\\[h=\\frac{3r}{2}=3\\,\\mathrm{cm}\\]\n\n\\[b=\\sqrt{3}r=2\\sqrt{3}\\,\\mathrm{cm}\\]\n\n\\[A_{\\max}=\\frac{3\\sqrt{3}}{4}r^2\\]\n\n\\[A_{\\max}=3\\sqrt{3}\\,\\mathrm{cm}^2\\]\n**固定结论：h=3 cm，底边 b=2√3 cm，最大面积 A=3√3 cm²≈5.1961524227 cm²。** 这组结论属于 r=2 cm 的题设，不随下方滑块改写。\n\n还有一条独立核对路径：最大值处三角形为等边三角形，外接圆半径 r 对应边长 √3r。用等边三角形面积公式，而非重复代入前面的面积函数：\n\n\n\\[A=\\frac{\\sqrt{3}}{4}(\\sqrt{3}r)^2=\\frac{3\\sqrt{3}}{4}r^2=3\\sqrt{3}\\,\\mathrm{cm}^2\\]\n\n## 03 · 当前实验：从 h/r=1 开始\n实验的初始状态故意选在 h/r=1：此时 h=2 cm、b=4 cm、A=4 cm²。拖动高度比例，观察图形、长度和面积一起变化。上方的最优结论保持固定，下方的读数描述你当前选择的三角形。\n\n\n\n圆内接三角形实验：半径 r=2 cm，初始高度 h/r=1。\n底边 b=2√(2rh−h²)，面积 A=h√(2rh−h²)。\n初始实验结果：高度 2 cm；半底边 2 cm；底边 4 cm；面积 4 cm²。\n滑块或精确输入范围 0.05≤h/r≤1.95；结果表随当前实验联动，重置恢复初始值。固定推导与全文复制保留初始题设。\n\n先找到 h/r=1.5，再移动到另一个高度。比较当前面积与 3√3 cm²，并解释：为什么底边变长，并不保证面积继续增加？重置预览会回到初始 h/r=1；重新载入时可能恢复本地已保存的真实操作。\n\n\n## 04 · 边界与自检\n解析端点 h=0 和 h=2r 都是退化三角形，面积为零。现有滑块只覆盖 0.05≤h/r≤1.95，两个端点不在实验范围内；不要把滑块最左或最右的位置当成退化端点。\n\n长度以 cm 计，面积以 cm² 计。固定半径不变时，改变高度会同时改变底边。当前图形与最优图形不同，表示你正在比较不同状态，并不推翻极值推导。"},{"id":"G02","title":"圆锥相关速率与换元积分","mode":"document","goal":"在固定条件下核对变化率、单位和链式法则回验。","instructions":"先由相似三角形确定水面半径，再用体积守恒核对相关速率；读到最后的定义域说明。","expected":"R=3 m、H=6 m、Q=2 m³/s、h=2 m 时 dh/dt=2/π m/s；积分为 sin(x²)+C，回验包含 x=0。","limitations":"固定推导没有装饰性滑块；不新增通用积分求解器。零水深奇异，满水停止该模型。","view":{"schemaVersion":1,"contentId":"gallery-g02-v1","title":"变化有多快？从圆锥注水到换元积分","facts":{},"blocks":[{"id":"d_47e6e07e4009c5ec_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"这两个固定例题展示怎样从关系式得到变化率，再用求导核对积分。公式来自显式题设，不调用通用求解器，也没有需要改变题设的滑块。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"01 · 圆锥注水：先确定模型"}]},{"type":"paragraph","children":[{"type":"text","text":"静止圆锥的底面半径 R=3 m、高 H=6 m，水以恒定流量 Q=2 m³/s 注入，没有流出。当前水深 h=2 m。水面保持水平，圆锥尖端在下；模型只讨论 0\u003ch\u003cH。由相似三角形，水面半径 r_w=h/2，当前 r_w=1 m。"}]},{"type":"math","tex":"\\frac{r_w}{h}=\\frac{R}{H}=\\frac12","display":true,"math":{"tag":"mrow","children":[{"tag":"mfrac","children":[{"tag":"msub","children":[{"tag":"mi","text":"r"},{"tag":"mi","text":"w"}]},{"tag":"mi","text":"h"}]},{"tag":"mo","text":"="},{"tag":"mfrac","children":[{"tag":"mi","text":"R"},{"tag":"mi","text":"H"}]},{"tag":"mo","text":"="},{"tag":"mfrac","children":[{"tag":"mn","text":"1"},{"tag":"mn","text":"2"}]}]}},{"type":"math","tex":"V=\\frac13\\pi r_w^2h=\\frac{\\pi h^3}{12}","display":true,"math":{"tag":"mrow","children":[{"tag":"mi","text":"V"},{"tag":"mo","text":"="},{"tag":"mfrac","children":[{"tag":"mn","text":"1"},{"tag":"mn","text":"3"}]},{"tag":"mi","text":"π"},{"tag":"msubsup","children":[{"tag":"mi","text":"r"},{"tag":"mi","text":"w"},{"tag":"mn","text":"2"}]},{"tag":"mi","text":"h"},{"tag":"mo","text":"="},{"tag":"mfrac","children":[{"tag":"mrow","children":[{"tag":"mi","text":"π"},{"tag":"msup","children":[{"tag":"mi","text":"h"},{"tag":"mn","text":"3"}]}]},{"tag":"mn","text":"12"}]}]}},{"type":"heading","level":2,"children":[{"type":"text","text":"02 · 相关速率：保留单位和瞬时条件"}]},{"type":"paragraph","children":[{"type":"text","text":"对时间求导，而不是把当前 h=2 过早代入关系式："}]},{"type":"math","tex":"Q=\\frac{dV}{dt}=\\frac{\\pi h^2}{4}\\frac{dh}{dt}","display":true,"math":{"tag":"mrow","children":[{"tag":"mi","text":"Q"},{"tag":"mo","text":"="},{"tag":"mfrac","children":[{"tag":"mrow","children":[{"tag":"mi","text":"d"},{"tag":"mi","text":"V"}]},{"tag":"mrow","children":[{"tag":"mi","text":"d"},{"tag":"mi","text":"t"}]}]},{"tag":"mo","text":"="},{"tag":"mfrac","children":[{"tag":"mrow","children":[{"tag":"mi","text":"π"},{"tag":"msup","children":[{"tag":"mi","text":"h"},{"tag":"mn","text":"2"}]}]},{"tag":"mn","text":"4"}]},{"tag":"mfrac","children":[{"tag":"mrow","children":[{"tag":"mi","text":"d"},{"tag":"mi","text":"h"}]},{"tag":"mrow","children":[{"tag":"mi","text":"d"},{"tag":"mi","text":"t"}]}]}]}},{"type":"math","tex":"\\frac{dh}{dt}=\\frac{4Q}{\\pi h^2}","display":true,"math":{"tag":"mrow","children":[{"tag":"mfrac","children":[{"tag":"mrow","children":[{"tag":"mi","text":"d"},{"tag":"mi","text":"h"}]},{"tag":"mrow","children":[{"tag":"mi","text":"d"},{"tag":"mi","text":"t"}]}]},{"tag":"mo","text":"="},{"tag":"mfrac","children":[{"tag":"mrow","children":[{"tag":"mn","text":"4"},{"tag":"mi","text":"Q"}]},{"tag":"mrow","children":[{"tag":"mi","text":"π"},{"tag":"msup","children":[{"tag":"mi","text":"h"},{"tag":"mn","text":"2"}]}]}]}]}},{"type":"math","tex":"\\left.\\frac{dh}{dt}\\right|_{h=2}=\\frac{2}{\\pi}\\,\\mathrm{m/s}","display":true,"math":{"tag":"mrow","children":[{"tag":"msub","children":[{"tag":"mrow","children":[{"tag":"mfrac","children":[{"tag":"mrow","children":[{"tag":"mi","text":"d"},{"tag":"mi","text":"h"}]},{"tag":"mrow","children":[{"tag":"mi","text":"d"},{"tag":"mi","text":"t"}]}]},{"tag":"mo","attrs":{"fence":"true"},"text":"∣"}]},{"tag":"mrow","children":[{"tag":"mi","text":"h"},{"tag":"mo","text":"="},{"tag":"mn","text":"2"}]}]},{"tag":"mo","text":"="},{"tag":"mfrac","children":[{"tag":"mn","text":"2"},{"tag":"mi","text":"π"}]},{"tag":"mtext","text":" "},{"tag":"mrow","children":[{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"m"},{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"/"},{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"s"}]}]}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"固定结论：dh/dt=2/π m/s≈0.6366197724 m/s。"}]},{"type":"text","text":" 另一条独立核对路径是体积守恒：当前水面面积为 π·1²=π m²，单位时间进入的体积除以该面积，得到同一个高度变化率 Q/π。当前水体积 V=2π/3 m³，水面半径变化率 dr_w/dt=1/π m/s；不要把体积单位写成长度单位。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"03 · 换元积分：再用链式法则回验"}]},{"type":"paragraph","children":[{"type":"text","text":"这里 x∈R 且无量纲。令 u=x²，则 du=2x dx。这个步骤不需要除以 x，也不声称 x² 在整个实数域有唯一反函数。"}]},{"type":"math","tex":"\\int 2x\\cos(x^2)\\,dx=\\int\\cos u\\,du","display":true,"math":{"tag":"mrow","children":[{"tag":"mo","text":"∫"},{"tag":"mn","text":"2"},{"tag":"mi","text":"x"},{"tag":"mi","text":"cos"},{"tag":"mo","text":"⁡"},{"tag":"mo","attrs":{"stretchy":"false"},"text":"("},{"tag":"msup","children":[{"tag":"mi","text":"x"},{"tag":"mn","text":"2"}]},{"tag":"mo","attrs":{"stretchy":"false"},"text":")"},{"tag":"mtext","text":" "},{"tag":"mi","text":"d"},{"tag":"mi","text":"x"},{"tag":"mo","text":"="},{"tag":"mo","text":"∫"},{"tag":"mi","text":"cos"},{"tag":"mo","text":"⁡"},{"tag":"mi","text":"u"},{"tag":"mtext","text":" "},{"tag":"mi","text":"d"},{"tag":"mi","text":"u"}]}},{"type":"math","tex":"\\int 2x\\cos(x^2)\\,dx=\\sin(x^2)+C","display":true,"math":{"tag":"mrow","children":[{"tag":"mo","text":"∫"},{"tag":"mn","text":"2"},{"tag":"mi","text":"x"},{"tag":"mi","text":"cos"},{"tag":"mo","text":"⁡"},{"tag":"mo","attrs":{"stretchy":"false"},"text":"("},{"tag":"msup","children":[{"tag":"mi","text":"x"},{"tag":"mn","text":"2"}]},{"tag":"mo","attrs":{"stretchy":"false"},"text":")"},{"tag":"mtext","text":" "},{"tag":"mi","text":"d"},{"tag":"mi","text":"x"},{"tag":"mo","text":"="},{"tag":"mi","text":"sin"},{"tag":"mo","text":"⁡"},{"tag":"mo","attrs":{"stretchy":"false"},"text":"("},{"tag":"msup","children":[{"tag":"mi","text":"x"},{"tag":"mn","text":"2"}]},{"tag":"mo","attrs":{"stretchy":"false"},"text":")"},{"tag":"mo","text":"+"},{"tag":"mi","text":"C"}]}},{"type":"math","tex":"\\frac{d}{dx}\\bigl(\\sin(x^2)+C\\bigr)=2x\\cos(x^2)","display":true,"math":{"tag":"mrow","children":[{"tag":"mfrac","children":[{"tag":"mi","text":"d"},{"tag":"mrow","children":[{"tag":"mi","text":"d"},{"tag":"mi","text":"x"}]}]},{"tag":"mo","attrs":{"fence":"true","stretchy":"true","minsize":"1.2em","maxsize":"1.2em"},"text":"("},{"tag":"mi","text":"sin"},{"tag":"mo","text":"⁡"},{"tag":"mo","attrs":{"stretchy":"false"},"text":"("},{"tag":"msup","children":[{"tag":"mi","text":"x"},{"tag":"mn","text":"2"}]},{"tag":"mo","attrs":{"stretchy":"false"},"text":")"},{"tag":"mo","text":"+"},{"tag":"mi","text":"C"},{"tag":"mo","attrs":{"fence":"true","stretchy":"true","minsize":"1.2em","maxsize":"1.2em"},"text":")"},{"tag":"mo","text":"="},{"tag":"mn","text":"2"},{"tag":"mi","text":"x"},{"tag":"mi","text":"cos"},{"tag":"mo","text":"⁡"},{"tag":"mo","attrs":{"stretchy":"false"},"text":"("},{"tag":"msup","children":[{"tag":"mi","text":"x"},{"tag":"mn","text":"2"}]},{"tag":"mo","attrs":{"stretchy":"false"},"text":")"}]}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"回验包含 x=0："}]},{"type":"text","text":" 两边在 x=0 都是零，不能为了换元而排除这个点。C 是任意积分常数；上面的导数关系对所有实数 x 成立。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"04 · 边界与适用范围"}]},{"type":"paragraph","children":[{"type":"text","text":"圆锥在 h=0 时，水面面积为零，当前相关速率表达式奇异；不要在零高度直接使用它。到 h=H=6 m 满水时停止这个“只有注入、没有流出”的模型。当前 2/π 是 h=2 m 的瞬时速率，不是整个注水过程中不变的高度速率。"}]},{"type":"paragraph","children":[{"type":"text","text":"本例到此结束。先检查水面半径和单位，再用体积守恒核对圆锥结果；用链式法则核对积分，而不是把公式排版成功当作推导正确的证据。"}]}]}],"viewVersion":1,"mode":"document","documentVersion":1,"sourceHash":"9c90001deff3bff7","callouts":{}},"text":"# 变化有多快？从圆锥注水到换元积分\n\n这两个固定例题展示怎样从关系式得到变化率，再用求导核对积分。公式来自显式题设，不调用通用求解器，也没有需要改变题设的滑块。\n\n\n## 01 · 圆锥注水：先确定模型\n静止圆锥的底面半径 R=3 m、高 H=6 m，水以恒定流量 Q=2 m³/s 注入，没有流出。当前水深 h=2 m。水面保持水平，圆锥尖端在下；模型只讨论 0\u003ch\u003cH。由相似三角形，水面半径 r_w=h/2，当前 r_w=1 m。\n\n\n\\[\\frac{r_w}{h}=\\frac{R}{H}=\\frac12\\]\n\n\\[V=\\frac13\\pi r_w^2h=\\frac{\\pi h^3}{12}\\]\n\n## 02 · 相关速率：保留单位和瞬时条件\n对时间求导，而不是把当前 h=2 过早代入关系式：\n\n\n\\[Q=\\frac{dV}{dt}=\\frac{\\pi h^2}{4}\\frac{dh}{dt}\\]\n\n\\[\\frac{dh}{dt}=\\frac{4Q}{\\pi h^2}\\]\n\n\\[\\left.\\frac{dh}{dt}\\right|_{h=2}=\\frac{2}{\\pi}\\,\\mathrm{m/s}\\]\n**固定结论：dh/dt=2/π m/s≈0.6366197724 m/s。** 另一条独立核对路径是体积守恒：当前水面面积为 π·1²=π m²，单位时间进入的体积除以该面积，得到同一个高度变化率 Q/π。当前水体积 V=2π/3 m³，水面半径变化率 dr_w/dt=1/π m/s；不要把体积单位写成长度单位。\n\n\n## 03 · 换元积分：再用链式法则回验\n这里 x∈R 且无量纲。令 u=x²，则 du=2x dx。这个步骤不需要除以 x，也不声称 x² 在整个实数域有唯一反函数。\n\n\n\\[\\int 2x\\cos(x^2)\\,dx=\\int\\cos u\\,du\\]\n\n\\[\\int 2x\\cos(x^2)\\,dx=\\sin(x^2)+C\\]\n\n\\[\\frac{d}{dx}\\bigl(\\sin(x^2)+C\\bigr)=2x\\cos(x^2)\\]\n**回验包含 x=0：** 两边在 x=0 都是零，不能为了换元而排除这个点。C 是任意积分常数；上面的导数关系对所有实数 x 成立。\n\n\n## 04 · 边界与适用范围\n圆锥在 h=0 时，水面面积为零，当前相关速率表达式奇异；不要在零高度直接使用它。到 h=H=6 m 满水时停止这个“只有注入、没有流出”的模型。当前 2/π 是 h=2 m 的瞬时速率，不是整个注水过程中不变的高度速率。\n\n本例到此结束。先检查水面半径和单位，再用体积守恒核对圆锥结果；用链式法则核对积分，而不是把公式排版成功当作推导正确的证据。"},{"id":"G03","title":"匀加速运动与光滑斜面","mode":"document","goal":"用真实运动和受力组件核对单位、坐标及独立物理标准值。","instructions":"先只改变运动时间，核对 0/1/2 s；再切换受力投影与合力显示。重置恢复初始实验。","expected":"原题设 t=1 s 时 v=10 m/s、x=15 m；m=2 kg、g=10 m/s²、θ=30° 时 N=10√3 N、合力10 N、加速度5 m/s²。","limitations":"两个题目相互独立。斜面仅有重力与接触力；运动控件改值后不改写固定题设结论。","view":{"schemaVersion":1,"contentId":"gallery-g03-v1","title":"运动与受力：把数值放回模型条件","facts":{},"blocks":[{"id":"d_1302d0ff55542e37_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"下面是两个独立的固定物理题。先读初始条件与坐标约定，再操作真实运动实验和受力图；不要把它们拼成同一个运动过程。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"01 · 匀加速运动：先确定初始位置"}]},{"type":"paragraph","children":[{"type":"text","text":"一维运动采用 SI 单位：x0=0 m，v0=20 m/s，a=-10 m/s²，观察区间 0≤t≤2 s。正方向是位置增大的方向；负加速度表示速度沿负方向变化，不等于物体立即沿负方向运动。"}]},{"type":"math","tex":"v(t)=20-10t\\quad(\\mathrm{m/s})","display":true,"math":{"tag":"mrow","children":[{"tag":"mi","text":"v"},{"tag":"mo","attrs":{"stretchy":"false"},"text":"("},{"tag":"mi","text":"t"},{"tag":"mo","attrs":{"stretchy":"false"},"text":")"},{"tag":"mo","text":"="},{"tag":"mn","text":"20"},{"tag":"mo","text":"−"},{"tag":"mn","text":"10"},{"tag":"mi","text":"t"},{"tag":"mspace","attrs":{"width":"1em"},"text":""},{"tag":"mo","attrs":{"stretchy":"false"},"text":"("},{"tag":"mrow","children":[{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"m"},{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"/"},{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"s"}]},{"tag":"mo","attrs":{"stretchy":"false"},"text":")"}]}},{"type":"math","tex":"x(t)=20t-5t^2\\quad(\\mathrm{m})","display":true,"math":{"tag":"mrow","children":[{"tag":"mi","text":"x"},{"tag":"mo","attrs":{"stretchy":"false"},"text":"("},{"tag":"mi","text":"t"},{"tag":"mo","attrs":{"stretchy":"false"},"text":")"},{"tag":"mo","text":"="},{"tag":"mn","text":"20"},{"tag":"mi","text":"t"},{"tag":"mo","text":"−"},{"tag":"mn","text":"5"},{"tag":"msup","children":[{"tag":"mi","text":"t"},{"tag":"mn","text":"2"}]},{"tag":"mspace","attrs":{"width":"1em"},"text":""},{"tag":"mo","attrs":{"stretchy":"false"},"text":"("},{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"m"},{"tag":"mo","attrs":{"stretchy":"false"},"text":")"}]}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"固定结论：t=1 s 时，v=10 m/s，x=15 m。"}]},{"type":"text","text":" 独立核对位置的方法是计算速度图下面积：前一秒的梯形面积为 (20+10)×1/2=15 m。t=2 s 时，v=0 m/s，x=20 m；速度图前两秒的三角形面积也是 20 m。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"02 · 当前运动实验"}]},{"type":"paragraph","children":[{"type":"text","text":"实验初始选在 t=1 s。先只移动时间滑块，核对 t=0、1、2 s 的读数；再改变初速度或加速度，观察新实验状态。改变控件后，上面的固定结论仍属于原题设，不会自动变成新条件下的结论。重置恢复 v0=20 m/s、a=-10 m/s²、t=1 s。"}]}]},{"id":"d_1bc01fd2329014be_0","kind":"component","type":"motion-lab","data":{"initialVelocity":20,"acceleration":-10,"duration":2,"time":1,"unit":"SI"}},{"id":"d_6bba2c60225d78f0_0","kind":"prose","nodes":[{"type":"heading","level":2,"children":[{"type":"text","text":"03 · 光滑斜面：只画真实作用力"}]},{"type":"paragraph","children":[{"type":"text","text":"这是另一道题：静止、光滑的斜面上放置 m=2 kg 的物块，采用题设 g=10 m/s²，斜面向右上升，θ=30°。仅有重力与支持力，没有摩擦或外加力。全局 +x 向右、+y 向上；局部 +x′ 沿斜面向右上，故物块的沿面加速度方向是负 x′。"}]},{"type":"math","tex":"N=mg\\cos30^\\circ=10\\sqrt3\\,\\mathrm{N}","display":true,"math":{"tag":"mrow","children":[{"tag":"mi","text":"N"},{"tag":"mo","text":"="},{"tag":"mi","text":"m"},{"tag":"mi","text":"g"},{"tag":"mi","text":"cos"},{"tag":"mo","text":"⁡"},{"tag":"msup","children":[{"tag":"mn","text":"30"},{"tag":"mo","text":"∘"}]},{"tag":"mo","text":"="},{"tag":"mn","text":"10"},{"tag":"msqrt","children":[{"tag":"mn","text":"3"}]},{"tag":"mtext","text":" "},{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"N"}]}},{"type":"math","tex":"|F_{\\mathrm{net}}|=mg\\sin30^\\circ=10\\,\\mathrm{N}","display":true,"math":{"tag":"mrow","children":[{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"∣"},{"tag":"msub","children":[{"tag":"mi","text":"F"},{"tag":"mrow","children":[{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"n"},{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"e"},{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"t"}]}]},{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"∣"},{"tag":"mo","text":"="},{"tag":"mi","text":"m"},{"tag":"mi","text":"g"},{"tag":"mi","text":"sin"},{"tag":"mo","text":"⁡"},{"tag":"msup","children":[{"tag":"mn","text":"30"},{"tag":"mo","text":"∘"}]},{"tag":"mo","text":"="},{"tag":"mn","text":"10"},{"tag":"mtext","text":" "},{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"N"}]}},{"type":"math","tex":"|a|=g\\sin30^\\circ=5\\,\\mathrm{m/s^2}","display":true,"math":{"tag":"mrow","children":[{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"∣"},{"tag":"mi","text":"a"},{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"∣"},{"tag":"mo","text":"="},{"tag":"mi","text":"g"},{"tag":"mi","text":"sin"},{"tag":"mo","text":"⁡"},{"tag":"msup","children":[{"tag":"mn","text":"30"},{"tag":"mo","text":"∘"}]},{"tag":"mo","text":"="},{"tag":"mn","text":"5"},{"tag":"mtext","text":" "},{"tag":"mrow","children":[{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"m"},{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"/"},{"tag":"msup","children":[{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"s"},{"tag":"mn","text":"2"}]}]}]}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"固定结论：支持力 N=10√3 N，合力大小 10 N，加速度大小 5 m/s²，方向沿斜面向左下。"}]},{"type":"text","text":" 全局支持力分量为 (−5√3,15) N；重力分量为 (0,−20) N；二者相加得合力 (−5√3,−5) N。合力与分量是已有真实力的计算结果，不是第三个作用力。"}]}]},{"id":"d_b725876b5385981d_0","kind":"component","type":"force-diagram","data":{"body":"质量 2 kg 的物块","unit":"N","axisAngle":30,"forces":[{"id":"gravity","label":"重力","fx":0,"fy":-20,"tone":"orange"},{"id":"normal","label":"支持力","fx":-8.660254037844386,"fy":15.000000000000002,"tone":"green"}],"note":"静止光滑斜面，仅重力与接触力；m=2 kg，g=10 m/s²，θ=30°；全局 +x 向右、+y 向上，局部 +x′ 沿 θ 指定的切线（负坡角时向右下）。"}},{"id":"d_ecaf56435b5eda1d_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"可切换坐标投影、显示或隐藏合力，核对数据表与箭头；切换显示不改变质量、g 或坡角。沿面方向的加速度为 −5 m/s²，其大小为 5 m/s²，两个表述并不矛盾。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"04 · 定义域与自检"}]},{"type":"paragraph","children":[{"type":"text","text":"运动实验只展示有限时间内的匀加速模型，不模拟碰撞或复杂轨道。本斜面结论只适用于静止光滑平面上的重力与接触模型，不适用于有摩擦或额外拉力的情况；也不把题设 g=10 悄悄换成默认值。"}]},{"type":"paragraph","children":[{"type":"text","text":"本例到此结束。先区分速度、加速度与各自单位，再区分真实力、合力及坐标分量。"}]}]}],"viewVersion":1,"mode":"document","documentVersion":1,"sourceHash":"1ff58d4c6eac9502","callouts":{}},"text":"# 运动与受力：把数值放回模型条件\n\n下面是两个独立的固定物理题。先读初始条件与坐标约定，再操作真实运动实验和受力图；不要把它们拼成同一个运动过程。\n\n\n## 01 · 匀加速运动：先确定初始位置\n一维运动采用 SI 单位：x0=0 m，v0=20 m/s，a=-10 m/s²，观察区间 0≤t≤2 s。正方向是位置增大的方向；负加速度表示速度沿负方向变化，不等于物体立即沿负方向运动。\n\n\n\\[v(t)=20-10t\\quad(\\mathrm{m/s})\\]\n\n\\[x(t)=20t-5t^2\\quad(\\mathrm{m})\\]\n**固定结论：t=1 s 时，v=10 m/s，x=15 m。** 独立核对位置的方法是计算速度图下面积：前一秒的梯形面积为 (20+10)×1/2=15 m。t=2 s 时，v=0 m/s，x=20 m；速度图前两秒的三角形面积也是 20 m。\n\n\n## 02 · 当前运动实验\n实验初始选在 t=1 s。先只移动时间滑块，核对 t=0、1、2 s 的读数；再改变初速度或加速度，观察新实验状态。改变控件后，上面的固定结论仍属于原题设，不会自动变成新条件下的结论。重置恢复 v0=20 m/s、a=-10 m/s²、t=1 s。\n\n\n\n匀加速运动实验：v₀=20 m/s，a=-10 m/s²，时长 2 s。\n初始观察时间 t=1 s。\nv(t)=v₀+at；x(t)=v₀t+½at²。实验读数不改写固定题设。\n\n\n## 03 · 光滑斜面：只画真实作用力\n这是另一道题：静止、光滑的斜面上放置 m=2 kg 的物块，采用题设 g=10 m/s²，斜面向右上升，θ=30°。仅有重力与支持力，没有摩擦或外加力。全局 +x 向右、+y 向上；局部 +x′ 沿斜面向右上，故物块的沿面加速度方向是负 x′。\n\n\n\\[N=mg\\cos30^\\circ=10\\sqrt3\\,\\mathrm{N}\\]\n\n\\[|F_{\\mathrm{net}}|=mg\\sin30^\\circ=10\\,\\mathrm{N}\\]\n\n\\[|a|=g\\sin30^\\circ=5\\,\\mathrm{m/s^2}\\]\n**固定结论：支持力 N=10√3 N，合力大小 10 N，加速度大小 5 m/s²，方向沿斜面向左下。** 全局支持力分量为 (−5√3,15) N；重力分量为 (0,−20) N；二者相加得合力 (−5√3,−5) N。合力与分量是已有真实力的计算结果，不是第三个作用力。\n\n\n\n质量 2 kg 的物块\n重力：Fx=0 N，Fy=-20 N\n支持力：Fx=-8.660254037844386 N，Fy=15.000000000000002 N\n观察轴旋转 30°；分力不增加真实力。\n静止光滑斜面，仅重力与接触力；m=2 kg，g=10 m/s²，θ=30°；全局 +x 向右、+y 向上，局部 +x′ 沿 θ 指定的切线（负坡角时向右下）。\n\n可切换坐标投影、显示或隐藏合力，核对数据表与箭头；切换显示不改变质量、g 或坡角。沿面方向的加速度为 −5 m/s²，其大小为 5 m/s²，两个表述并不矛盾。\n\n\n## 04 · 定义域与自检\n运动实验只展示有限时间内的匀加速模型，不模拟碰撞或复杂轨道。本斜面结论只适用于静止光滑平面上的重力与接触模型，不适用于有摩擦或额外拉力的情况；也不把题设 g=10 悄悄换成默认值。\n\n本例到此结束。先区分速度、加速度与各自单位，再区分真实力、合力及坐标分量。"},{"id":"G04","title":"哲学论证与针对性反例","mode":"document","goal":"分开事实判断与价值前提，找出 A3/B3 的隐含前提及针对它们的反例。","instructions":"按 A1–A3、B1–B3 阅读，用 Tab 到反例 summary，再用 Enter 或 Space 展开与收起。","expected":"两种立场不设默认胜者；反例与尚未解决的问题都属于完整文档与复制内容。","limitations":"人物和情境是合成思想实验，没有哲学家引文、经验研究或可信度评分。","view":{"schemaVersion":1,"contentId":"intellectual-g04-v1","title":"共享夜间工作室：总时长够解释公平吗？","facts":{},"blocks":[{"id":"d_3d4db4333df4b1b5_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"这是一个自编的合成伦理思考实验。人物、安排和数量均为讨论而设，不是调查结果，也不代表任何哲学家的原话。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"01 · 把事实题设与价值问题分开"}]},{"type":"paragraph","children":[{"type":"text","text":"一间社区工作室每晚只能接待一组。甲组希望连续使用两晚完成无法中断的制作；乙组只能在周二到场。管理者可以让甲组占用周一和周二，也可以让两组各用一晚，但后一种安排会使甲组的这次制作无法完成。题设还规定两组事先都没有获得承诺。"}]},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"事实判断 F1："}]},{"type":"text","text":" 在本题设中，甲组的制作需要连续两晚。"},{"type":"strong","children":[{"type":"text","text":"事实判断 F2："}]},{"type":"text","text":" 乙组只能在周二到场。现实中这些条件需要证据；本思考实验暂时把它们视为已给定。它们本身并不推出谁应当优先。"}]},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"价值问题："}]},{"type":"text","text":" 公平应更看重活动能否完成，还是让每组都有平等的参与机会？回答需要说出价值前提，不能只把时长加总。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"02 · 两种立场怎样形成结论"}]}]},{"id":"d_9fcd4c981b7aff50_0","kind":"component","type":"comparison","data":{"items":[{"label":"立场 A · 完成优先","title":"先保障一项活动能够完成","tone":"blue","detail":"前提 A1（价值）：资源应尽量带来可完成的活动。\n\n理由 A2：把两晚连用，甲组能完成制作；拆开则这次制作无法完成。\n\n推论 A3：本轮优先把两晚给甲组。该推论还依赖“完成数量足以衡量收益”的隐含前提。"},{"label":"立场 B · 机会优先","title":"每组至少获得一次进入机会","tone":"green","detail":"前提 B1（价值）：在无人获得先前承诺时，每组的进入机会应得到同等考虑。\n\n理由 B2：只给甲组会使乙组本轮没有可行时段。\n\n推论 B3：本轮各给一晚。该推论还依赖“获得一晚就构成有意义参与”的隐含前提。"}],"note":"颜色只区分立场；没有可信度评分、观点投票或默认胜者。"}},{"id":"d_80fb2f4f94c2bf7f_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"两种主张都使用了事实条件，也都额外选择了评价标准。争议不是算术谁算错了，而是哪些收益和损失有资格进入比较。明确前提后，才能知道一条反例究竟改变了什么。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"03 · 反例要对准具体推论"}]}]},{"id":"d_0e3c2a8c4543cd6a_0","kind":"collapse","summary":"检查 A3：完成优先会不会忽略持续被排除的人？","blocks":[{"id":"d_5eed753a15f5c764_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"反例 A："}]},{"type":"text","text":" 假设每一轮都有另一组需要连续时段，而乙组总只能在唯一的晚间到场。每轮都使用 A3，乙组可能长期没有进入机会。"}]},{"type":"paragraph","children":[{"type":"text","text":"这个反例针对的是从“本轮多完成一项活动”推到“本轮就应优先甲组”的 A3，以及其中忽略跨轮次排除的前提。它没有否定事实 F1，也没有证明完成活动毫无价值。若 A 的原则加入轮次补偿，结论需要重新判断。"}]}]}]},{"id":"d_45ddd0ae8de7ac76_0","kind":"collapse","summary":"检查 B3：分到相同时长就等于得到相同机会吗？","blocks":[{"id":"d_2dfc529a43d0ef54_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"反例 B："}]},{"type":"text","text":" 如果甲组拿到的一晚不足以启动任何可保留的制作，各分一晚便只让乙组得到有意义的使用，甲组得到形式相同但实际不可用的份额。"}]},{"type":"paragraph","children":[{"type":"text","text":"这个反例针对的是 B3 所依赖的“分到一晚就构成有意义参与”，没有否定平等考虑本身。B 可以改为比较可用机会，或跨多轮安排补偿；这会改变规则，而非从事实直接消除价值争议。"}]}]}]},{"id":"d_b7fff32f6d4daa6b_0","kind":"prose","nodes":[{"type":"heading","level":2,"children":[{"type":"text","text":"04 · 尚未解决的问题"}]},{"type":"list","ordered":true,"start":1,"children":[{"type":"item","children":[{"type":"text","text":"评价单位是这一晚、这一轮，还是多轮中的累计机会？题设没有决定时间范围。"}]},{"type":"item","children":[{"type":"text","text":"“完成一项活动”能否与“某组被排除一次”直接比较？本例没有共同的量尺。"}]},{"type":"item","children":[{"type":"text","text":"谁可以提出例外，申诉和复核怎样进行？本例没有规定程序。"}]}]},{"type":"paragraph","children":[{"type":"text","text":"一个谨慎的暂定结论是：先公开分配原则及其时间范围，再说明如何处理长期排除与不可分割的活动。它仍不能唯一决定本轮安排。请从 A3 或 B3 中选一条，指出它的隐含前提，并找出真正针对这条推论的反例。"}]}]}],"viewVersion":1,"mode":"document","documentVersion":1,"sourceHash":"7fd88901afce5999","callouts":{}},"text":"# 共享夜间工作室：总时长够解释公平吗？\n\n这是一个自编的合成伦理思考实验。人物、安排和数量均为讨论而设，不是调查结果，也不代表任何哲学家的原话。\n\n\n## 01 · 把事实题设与价值问题分开\n一间社区工作室每晚只能接待一组。甲组希望连续使用两晚完成无法中断的制作；乙组只能在周二到场。管理者可以让甲组占用周一和周二，也可以让两组各用一晚，但后一种安排会使甲组的这次制作无法完成。题设还规定两组事先都没有获得承诺。\n\n**事实判断 F1：** 在本题设中，甲组的制作需要连续两晚。**事实判断 F2：** 乙组只能在周二到场。现实中这些条件需要证据；本思考实验暂时把它们视为已给定。它们本身并不推出谁应当优先。\n\n**价值问题：** 公平应更看重活动能否完成，还是让每组都有平等的参与机会？回答需要说出价值前提，不能只把时长加总。\n\n\n## 02 · 两种立场怎样形成结论\n\n\n立场 A · 完成优先 · 先保障一项活动能够完成\n前提 A1（价值）：资源应尽量带来可完成的活动。\n\n理由 A2：把两晚连用，甲组能完成制作；拆开则这次制作无法完成。\n\n推论 A3：本轮优先把两晚给甲组。该推论还依赖“完成数量足以衡量收益”的隐含前提。\n立场 B · 机会优先 · 每组至少获得一次进入机会\n前提 B1（价值）：在无人获得先前承诺时，每组的进入机会应得到同等考虑。\n\n理由 B2：只给甲组会使乙组本轮没有可行时段。\n\n推论 B3：本轮各给一晚。该推论还依赖“获得一晚就构成有意义参与”的隐含前提。\n颜色只区分立场；没有可信度评分、观点投票或默认胜者。\n\n两种主张都使用了事实条件，也都额外选择了评价标准。争议不是算术谁算错了，而是哪些收益和损失有资格进入比较。明确前提后，才能知道一条反例究竟改变了什么。\n\n\n## 03 · 反例要对准具体推论\n\n\n检查 A3：完成优先会不会忽略持续被排除的人？\n**反例 A：** 假设每一轮都有另一组需要连续时段，而乙组总只能在唯一的晚间到场。每轮都使用 A3，乙组可能长期没有进入机会。\n\n这个反例针对的是从“本轮多完成一项活动”推到“本轮就应优先甲组”的 A3，以及其中忽略跨轮次排除的前提。它没有否定事实 F1，也没有证明完成活动毫无价值。若 A 的原则加入轮次补偿，结论需要重新判断。\n\n\n\n检查 B3：分到相同时长就等于得到相同机会吗？\n**反例 B：** 如果甲组拿到的一晚不足以启动任何可保留的制作，各分一晚便只让乙组得到有意义的使用，甲组得到形式相同但实际不可用的份额。\n\n这个反例针对的是 B3 所依赖的“分到一晚就构成有意义参与”，没有否定平等考虑本身。B 可以改为比较可用机会，或跨多轮安排补偿；这会改变规则，而非从事实直接消除价值争议。\n\n\n\n\n## 04 · 尚未解决的问题\n1. 评价单位是这一晚、这一轮，还是多轮中的累计机会？题设没有决定时间范围。\n2. “完成一项活动”能否与“某组被排除一次”直接比较？本例没有共同的量尺。\n3. 谁可以提出例外，申诉和复核怎样进行？本例没有规定程序。\n\n一个谨慎的暂定结论是：先公开分配原则及其时间范围，再说明如何处理长期排除与不可分割的活动。它仍不能唯一决定本轮安排。请从 A3 或 B3 中选一条，指出它的隐含前提，并找出真正针对这条推论的反例。"},{"id":"G05","title":"八节合成研究长文","mode":"document","goal":"在长文中追踪证据编号、计算与限制，并完整复制所有阅读材料。","instructions":"展开默认收起的静态章节概览；用方向键/Home/End 切换 tabs，展开审计细节，再复制完整文档。","expected":"八节正文、表格、代码、公式、SYN-E05 和两个 tabs 都在完整 fallback；复制失败提供只读全文。","limitations":"所有数字与证据均为合成材料；静态概览不声称定位、研究效果或用户理解度已验证。","view":{"schemaVersion":1,"contentId":"intellectual-g05-v1","title":"让证据可追踪：一份阅读界面的合成研究笔记","facts":{},"blocks":[{"id":"d_7a796975826293f1_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"本笔记完整自编，用于阅读、定位和复制练习。八节内容中的参与者、记录与数量都是合成材料，不是真实实验，不引用外部论文，也不支持关于任何产品效果的经验结论。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"01 · 摘要：先让结论能够回到材料"}]},{"type":"paragraph","children":[{"type":"text","text":"一篇文档可以显得条理分明，却仍然让读者难以判断某项结论从何而来。本笔记把“证据可追踪性”（evidence traceability）限定为一个很窄的任务：看到一句结论后，能否找到它对应的记录，并说清记录允许与不允许推出什么。这一定义不等于理解能力，也不把浏览速度当作知识掌握的替代量。"}]},{"type":"paragraph","children":[{"type":"text","text":"我们构造两个版本的阅读材料：版本 A 连续呈现相同文字，版本 B 在同一文字旁增加局部证据编号。两版的论点、篇幅和段落顺序在设定中相同。下文的演示数字只用于展示记录、计算与限制如何相互连接；它们不能证明编号一定更好。读者的任务是追踪一项计算、核对一次排除，再在结论旁找出尚未解决的解释。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"02 · 问题与术语：找到不等于理解"}]},{"type":"paragraph","children":[{"type":"text","text":"“定位成功”（retrieval success）指在给定任务中指出正确的材料编号；“解释充分”（adequate explanation）指能够说明材料与结论的关系。二者分开记录，因为读者可能找到一个编号，却误解它支持的范围；也可能用自己的话正确解释内容，却写错记录代号。混为单一分数会隐藏这两种情况。"}]},{"type":"paragraph","children":[{"type":"text","text":"合成问题 Q1 是：局部证据编号是否帮助读者返回相关材料？另一个问题 Q2 是：找到材料后，能否识别推论中的限制？这两问并不等价。我们没有为 Q2 构造足够的评分材料，因此下文只演示 Q1 的计数。任何把 Q1 的数字写成“理解提升”的表达，都超出了本笔记的操作性定义。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"03 · 方法：先冻结规则，再看计数"}]},{"type":"paragraph","children":[{"type":"text","text":"合成记录以一次任务为单位，不把它当作独立的真实参与者。每个版本设有十二条任务记录，同一人是否重复出现、任务难度是否相当，在这个教学材料中都没有真实数据可核对。设计里没有随机分派，也没有盲法；这些空缺将在第七节限制因果解释。"}]},{"type":"paragraph","children":[{"type":"text","text":"规则 R1：只有写出目标材料的正确编号才计为成功。规则 R2：在任务提示发出前已经中断的记录不进入分母。规则 R3：开始任务后没有回答仍计入分母，结果记为未成功。规则的区分很重要：提前退出与未作答不能为了提高比率而事后合并删除。[SYN-E01] 记录规则，[SYN-E02] 给出冻结后的汇总。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"04 · 证据账本：这些数字来自哪里"}]},{"type":"paragraph","children":[{"type":"text","text":"下表是本笔记自编的完整汇总。它展示一个能够复算的关系，不模拟统计显著性。计数均为任务条数，不代表人数；“未成功”包含开始任务后的无回答。"}]},{"type":"table","children":[{"type":"row","children":[{"type":"cell","header":true,"children":[{"type":"text","text":"版本"}]},{"type":"cell","header":true,"children":[{"type":"text","text":"原始任务记录"}]},{"type":"cell","header":true,"children":[{"type":"text","text":"提示前中断"}]},{"type":"cell","header":true,"children":[{"type":"text","text":"纳入任务 n"}]},{"type":"cell","header":true,"children":[{"type":"text","text":"定位成功 k"}]},{"type":"cell","header":true,"children":[{"type":"text","text":"未成功"}]}]},{"type":"row","children":[{"type":"cell","header":false,"children":[{"type":"text","text":"A · 连续文字"}]},{"type":"cell","header":false,"children":[{"type":"text","text":"12"}]},{"type":"cell","header":false,"children":[{"type":"text","text":"2"}]},{"type":"cell","header":false,"children":[{"type":"text","text":"10"}]},{"type":"cell","header":false,"children":[{"type":"text","text":"6"}]},{"type":"cell","header":false,"children":[{"type":"text","text":"4"}]}]},{"type":"row","children":[{"type":"cell","header":false,"children":[{"type":"text","text":"B · 局部编号"}]},{"type":"cell","header":false,"children":[{"type":"text","text":"12"}]},{"type":"cell","header":false,"children":[{"type":"text","text":"2"}]},{"type":"cell","header":false,"children":[{"type":"text","text":"10"}]},{"type":"cell","header":false,"children":[{"type":"text","text":"8"}]},{"type":"cell","header":false,"children":[{"type":"text","text":"2"}]}]}]},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"[SYN-E02] 汇总来源："}]},{"type":"text","text":" 为本笔记人工设定的两行计数，未从用户日志、论文或真实测试中提取。每行满足“原始记录−提示前中断=纳入任务”和“成功+未成功=纳入任务”。这些恒等式只能说明账面一致，不能证明样本设计合理或记录没有偏差。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"05 · 计算：比例与差值各表示什么"}]},{"type":"paragraph","children":[{"type":"text","text":"按预先声明的分母，定位比例为成功条数除以纳入任务条数。这里 n\u003e0，两个版本的比例分别为 6/10=0.6 和 8/10=0.8。比例没有物理单位；写成百分数后是 60% 与 80%，差值是 20 个百分点，而不是“提高 20%”。"}]},{"type":"math","tex":"p=\\frac{k}{n},\\qquad p_A=\\frac{6}{10}=0.6,\\qquad p_B=\\frac{8}{10}=0.8","display":true,"math":{"tag":"mrow","children":[{"tag":"mi","text":"p"},{"tag":"mo","text":"="},{"tag":"mfrac","children":[{"tag":"mi","text":"k"},{"tag":"mi","text":"n"}]},{"tag":"mo","attrs":{"separator":"true"},"text":","},{"tag":"mspace","attrs":{"width":"2em"},"text":""},{"tag":"msub","children":[{"tag":"mi","text":"p"},{"tag":"mi","text":"A"}]},{"tag":"mo","text":"="},{"tag":"mfrac","children":[{"tag":"mn","text":"6"},{"tag":"mn","text":"10"}]},{"tag":"mo","text":"="},{"tag":"mn","text":"0.6"},{"tag":"mo","attrs":{"separator":"true"},"text":","},{"tag":"mspace","attrs":{"width":"2em"},"text":""},{"tag":"msub","children":[{"tag":"mi","text":"p"},{"tag":"mi","text":"B"}]},{"tag":"mo","text":"="},{"tag":"mfrac","children":[{"tag":"mn","text":"8"},{"tag":"mn","text":"10"}]},{"tag":"mo","text":"="},{"tag":"mn","text":"0.8"}]}},{"type":"math","tex":"\\Delta p=p_B-p_A=0.2=20\\text{ percentage points}","display":true,"math":{"tag":"mrow","children":[{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"Δ"},{"tag":"mi","text":"p"},{"tag":"mo","text":"="},{"tag":"msub","children":[{"tag":"mi","text":"p"},{"tag":"mi","text":"B"}]},{"tag":"mo","text":"−"},{"tag":"msub","children":[{"tag":"mi","text":"p"},{"tag":"mi","text":"A"}]},{"tag":"mo","text":"="},{"tag":"mn","text":"0.2"},{"tag":"mo","text":"="},{"tag":"mn","text":"20"},{"tag":"mtext","text":" percentage points"}]}},{"type":"paragraph","children":[{"type":"text","text":"下面的代码是可阅读的计算示例，本页不会执行它。输入固定为 [SYN-E02]，显式拒绝空分母；代码可复算这些合成数字，无法补上研究设计中缺失的证据。"}]},{"type":"codeblock","text":"const evidence = [\n  { version: \"A\", successes: 6, included: 10 },\n  { version: \"B\", successes: 8, included: 10 }\n];\nconst rate = ({ successes, included }) =\u003e {\n  if (included \u003c= 0) throw new Error(\"A nonzero denominator is required\");\n  return successes / included;\n};\nconst difference = rate(evidence[1]) - rate(evidence[0]);\n// SYN-E03: difference is approximately 0.2, or 20 percentage points.","language":"js"},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"[SYN-E03] 计算来源："}]},{"type":"text","text":" 对 [SYN-E02] 的比例运算。浮点数表示可能有末位误差，报告以精确分数 8/10−6/10=1/5 为准；这里没有估计真实总体参数，也没有给出置信区间。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"06 · 解释：保留另一个读法"}]},{"type":"paragraph","children":[{"type":"text","text":"把一个差值称为“改进”之前，先问它是否可能来自任务条件。在这份合成材料中，数字由作者设定，根本没有经验因果效应可估计。两个标签页展示两条仍值得区分的解释路径；切换只改变当前阅读位置，不改变数据或支持力度。"}]}]},{"id":"d_e590240c7f2fc9c0_0","kind":"tabs","items":[{"id":"tab_0","label":"解释 A · 检索线索","blocks":[{"id":"d_97182756c2de56e4_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"[SYN-E04-A] 合成解释："}]},{"type":"text","text":" 局部编号可能提供检索线索（retrieval cue），让读者少花时间重新扫描段落。若要检验，需要保持任务和材料相同，并观察读者是否实际使用了编号。当前表格没有操作轨迹，不能证明这条机制发生。"}]}]}]},{"id":"tab_1","label":"解释 B · 任务差异","blocks":[{"id":"d_ec234257dfb34a15_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"[SYN-E04-B] 合成替代解释："}]},{"type":"text","text":" 如果 B 版任务更容易，或读者已经熟悉内容，差值也可能出现。这针对“编号导致更多成功”的推论；它没有否认表内 8/10 与 6/10 的算术关系。需要随机或平衡安排才能进一步区分。"}]}]}]}]},{"id":"d_7cc1bdaad83ba63e_0","kind":"collapse","summary":"展开排除记录的审计细节","open":false,"blocks":[{"id":"d_53d7d1a5375fa88d_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"[SYN-E05] 合成审计记录："}]},{"type":"text","text":" A-03、A-09、B-04、B-11 均被设定为在任务提示出现前中断，所以按 R2 排除；开始后的未作答仍按 R3 保留。记录代号为本笔记编写，不能用于识别任何真实个人。这段关闭时仍属于完整文档，完整复制应当保留这些代号与排除理由。"}]}]}]},{"id":"d_0c0786ad564e28f9_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"替代解释的价值，是指出下一份证据应该长什么样。若未来真的开展研究，可以记录任务顺序和既有知识，并预先写明排除规则。这里提出的是待检验设计，不把未来可能收集的资料写成已经获得的支持。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"07 · 限制：不能从这张表推出什么"}]},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"限制 L1 · 合成来源。"}]},{"type":"text","text":" 所有记录由作者设定，因此不能据此断言某个界面、群体或教学方法更有效。表格中的 20 个百分点只描述这两行教学数字。"}]},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"限制 L2 · 设计与依赖。"}]},{"type":"text","text":" 没有随机分派、任务难度控制或参与者层面的真实资料；同一人的重复任务可能相互依赖。即使把这些计数换成真实记录，也不能仅凭两行汇总排除混杂因素（confounding）。"}]},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"限制 L3 · 指标范围。"}]},{"type":"text","text":" 找到编号不是充分理解，也不是记忆保持。没有为解释质量、长期学习或可访问性收集数据，所以这些结果均未得到验证。"}]},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","text":"限制 L4 · 传播范围。"}]},{"type":"text","text":" 这是一份阅读与复制练习材料。它没有学术引用、统计显著性或可推广的经验结论。对真实研究的建议只是下一步设计问题，不能倒过来成为当前证据。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"08 · 来源索引与有条件的结论"}]},{"type":"paragraph","children":[{"type":"text","text":"这些编号是文内可辨识的合成来源标记，不是文献编号：[SYN-E01] 对应第三节规则 R1–R3；[SYN-E02] 对应第四节完整汇总；[SYN-E03] 对应第五节比例运算；[SYN-E04-A] 与 [SYN-E04-B] 对应第六节两种解释；[SYN-E05] 对应第六节折叠中的排除明细。编号只帮助返回材料，不增加证据可信度。"}]},{"type":"paragraph","children":[{"type":"text","text":"本笔记能够支持的结论很有限：读者可以核对这两行合成计数、复算差值，并指出该差值不能证明因果。更大的主张需要新的真实资料和合适的研究设计。现在请定位 [SYN-E05] 的排除理由，核对 20 个百分点的分母，再找到阻止因果结论的 L1 与 L2。"}]},{"type":"paragraph","children":[{"type":"text","text":"完整文档到此结束。复制时应保留八节正文、表格、公式、代码、关闭的排除明细以及两个标签页的解释；复制并不会把这些合成材料转变为真实研究。"}]}]}],"viewVersion":1,"mode":"document","documentVersion":1,"sourceHash":"11ed6bf1cda0c78f","callouts":{}},"text":"# 让证据可追踪：一份阅读界面的合成研究笔记\n\n本笔记完整自编，用于阅读、定位和复制练习。八节内容中的参与者、记录与数量都是合成材料，不是真实实验，不引用外部论文，也不支持关于任何产品效果的经验结论。\n\n\n## 01 · 摘要：先让结论能够回到材料\n一篇文档可以显得条理分明，却仍然让读者难以判断某项结论从何而来。本笔记把“证据可追踪性”（evidence traceability）限定为一个很窄的任务：看到一句结论后，能否找到它对应的记录，并说清记录允许与不允许推出什么。这一定义不等于理解能力，也不把浏览速度当作知识掌握的替代量。\n\n我们构造两个版本的阅读材料：版本 A 连续呈现相同文字，版本 B 在同一文字旁增加局部证据编号。两版的论点、篇幅和段落顺序在设定中相同。下文的演示数字只用于展示记录、计算与限制如何相互连接；它们不能证明编号一定更好。读者的任务是追踪一项计算、核对一次排除，再在结论旁找出尚未解决的解释。\n\n\n## 02 · 问题与术语：找到不等于理解\n“定位成功”（retrieval success）指在给定任务中指出正确的材料编号；“解释充分”（adequate explanation）指能够说明材料与结论的关系。二者分开记录，因为读者可能找到一个编号，却误解它支持的范围；也可能用自己的话正确解释内容，却写错记录代号。混为单一分数会隐藏这两种情况。\n\n合成问题 Q1 是：局部证据编号是否帮助读者返回相关材料？另一个问题 Q2 是：找到材料后，能否识别推论中的限制？这两问并不等价。我们没有为 Q2 构造足够的评分材料，因此下文只演示 Q1 的计数。任何把 Q1 的数字写成“理解提升”的表达，都超出了本笔记的操作性定义。\n\n\n## 03 · 方法：先冻结规则，再看计数\n合成记录以一次任务为单位，不把它当作独立的真实参与者。每个版本设有十二条任务记录，同一人是否重复出现、任务难度是否相当，在这个教学材料中都没有真实数据可核对。设计里没有随机分派，也没有盲法；这些空缺将在第七节限制因果解释。\n\n规则 R1：只有写出目标材料的正确编号才计为成功。规则 R2：在任务提示发出前已经中断的记录不进入分母。规则 R3：开始任务后没有回答仍计入分母，结果记为未成功。规则的区分很重要：提前退出与未作答不能为了提高比率而事后合并删除。[SYN-E01] 记录规则，[SYN-E02] 给出冻结后的汇总。\n\n\n## 04 · 证据账本：这些数字来自哪里\n下表是本笔记自编的完整汇总。它展示一个能够复算的关系，不模拟统计显著性。计数均为任务条数，不代表人数；“未成功”包含开始任务后的无回答。\n\n版本 | 原始任务记录 | 提示前中断 | 纳入任务 n | 定位成功 k | 未成功\nA · 连续文字 | 12 | 2 | 10 | 6 | 4\nB · 局部编号 | 12 | 2 | 10 | 8 | 2\n**[SYN-E02] 汇总来源：** 为本笔记人工设定的两行计数，未从用户日志、论文或真实测试中提取。每行满足“原始记录−提示前中断=纳入任务”和“成功+未成功=纳入任务”。这些恒等式只能说明账面一致，不能证明样本设计合理或记录没有偏差。\n\n\n## 05 · 计算：比例与差值各表示什么\n按预先声明的分母，定位比例为成功条数除以纳入任务条数。这里 n\u003e0，两个版本的比例分别为 6/10=0.6 和 8/10=0.8。比例没有物理单位；写成百分数后是 60% 与 80%，差值是 20 个百分点，而不是“提高 20%”。\n\n\n\\[p=\\frac{k}{n},\\qquad p_A=\\frac{6}{10}=0.6,\\qquad p_B=\\frac{8}{10}=0.8\\]\n\n\\[\\Delta p=p_B-p_A=0.2=20\\text{ percentage points}\\]\n下面的代码是可阅读的计算示例，本页不会执行它。输入固定为 [SYN-E02]，显式拒绝空分母；代码可复算这些合成数字，无法补上研究设计中缺失的证据。\n\n\n```js\nconst evidence = [\n  { version: \"A\", successes: 6, included: 10 },\n  { version: \"B\", successes: 8, included: 10 }\n];\nconst rate = ({ successes, included }) =\u003e {\n  if (included \u003c= 0) throw new Error(\"A nonzero denominator is required\");\n  return successes / included;\n};\nconst difference = rate(evidence[1]) - rate(evidence[0]);\n// SYN-E03: difference is approximately 0.2, or 20 percentage points.\n```\n**[SYN-E03] 计算来源：** 对 [SYN-E02] 的比例运算。浮点数表示可能有末位误差，报告以精确分数 8/10−6/10=1/5 为准；这里没有估计真实总体参数，也没有给出置信区间。\n\n\n## 06 · 解释：保留另一个读法\n把一个差值称为“改进”之前，先问它是否可能来自任务条件。在这份合成材料中，数字由作者设定，根本没有经验因果效应可估计。两个标签页展示两条仍值得区分的解释路径；切换只改变当前阅读位置，不改变数据或支持力度。\n\n\n\n解释 A · 检索线索\n**[SYN-E04-A] 合成解释：** 局部编号可能提供检索线索（retrieval cue），让读者少花时间重新扫描段落。若要检验，需要保持任务和材料相同，并观察读者是否实际使用了编号。当前表格没有操作轨迹，不能证明这条机制发生。\n\n\n\n解释 B · 任务差异\n**[SYN-E04-B] 合成替代解释：** 如果 B 版任务更容易，或读者已经熟悉内容，差值也可能出现。这针对“编号导致更多成功”的推论；它没有否认表内 8/10 与 6/10 的算术关系。需要随机或平衡安排才能进一步区分。\n\n\n\n展开排除记录的审计细节\n**[SYN-E05] 合成审计记录：** A-03、A-09、B-04、B-11 均被设定为在任务提示出现前中断，所以按 R2 排除；开始后的未作答仍按 R3 保留。记录代号为本笔记编写，不能用于识别任何真实个人。这段关闭时仍属于完整文档，完整复制应当保留这些代号与排除理由。\n\n\n\n替代解释的价值，是指出下一份证据应该长什么样。若未来真的开展研究，可以记录任务顺序和既有知识，并预先写明排除规则。这里提出的是待检验设计，不把未来可能收集的资料写成已经获得的支持。\n\n\n## 07 · 限制：不能从这张表推出什么\n**限制 L1 · 合成来源。** 所有记录由作者设定，因此不能据此断言某个界面、群体或教学方法更有效。表格中的 20 个百分点只描述这两行教学数字。\n\n**限制 L2 · 设计与依赖。** 没有随机分派、任务难度控制或参与者层面的真实资料；同一人的重复任务可能相互依赖。即使把这些计数换成真实记录，也不能仅凭两行汇总排除混杂因素（confounding）。\n\n**限制 L3 · 指标范围。** 找到编号不是充分理解，也不是记忆保持。没有为解释质量、长期学习或可访问性收集数据，所以这些结果均未得到验证。\n\n**限制 L4 · 传播范围。** 这是一份阅读与复制练习材料。它没有学术引用、统计显著性或可推广的经验结论。对真实研究的建议只是下一步设计问题，不能倒过来成为当前证据。\n\n\n## 08 · 来源索引与有条件的结论\n这些编号是文内可辨识的合成来源标记，不是文献编号：[SYN-E01] 对应第三节规则 R1–R3；[SYN-E02] 对应第四节完整汇总；[SYN-E03] 对应第五节比例运算；[SYN-E04-A] 与 [SYN-E04-B] 对应第六节两种解释；[SYN-E05] 对应第六节折叠中的排除明细。编号只帮助返回材料，不增加证据可信度。\n\n本笔记能够支持的结论很有限：读者可以核对这两行合成计数、复算差值，并指出该差值不能证明因果。更大的主张需要新的真实资料和合适的研究设计。现在请定位 [SYN-E05] 的排除理由，核对 20 个百分点的分母，再找到阻止因果结论的 L1 与 L2。\n\n完整文档到此结束。复制时应保留八节正文、表格、公式、代码、关闭的排除明细以及两个标签页的解释；复制并不会把这些合成材料转变为真实研究。"},{"id":"G06","title":"简单原生短答对照","mode":"native-reference","goal":"说明短确认无需富文档工具，保留直接阅读的静态文本参考。","instructions":"阅读下面的短答参考；本场景没有组件、iframe 或装饰性控件。","expected":"静态原生文本参考视图：已收到。下一步先核对题设，再检查结论。","limitations":"这是本地文本参考，不是真实 ChatGPT UI 或 MCP widget；未测试真实原生路由。","text":"已收到。下一步先核对题设，再检查结论。"},{"id":"G07","title":"安全数学降级","mode":"document","goal":"区分有界非禁止坏 TeX 的安全降级与禁止命令的硬拒绝。","instructions":"核对正常公式、坏公式原 TeX、坏公式后的正文与文档末尾，再检查完整复制。","expected":"恰有一处有界坏 TeX 降级，两条正常公式继续显示；首尾正文及原 TeX 完整保留。","limitations":"局部排版失败不等于修正原式。禁止命令由 G08 真实拒绝，不能用安全降级放行。","view":{"schemaVersion":1,"contentId":"gallery-g07-v1","title":"一处公式排版失败，正文仍应完整可读","facts":{},"blocks":[{"id":"d_8c79d033baba938b_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"安全降级示例开始。这里使用一条有界、非禁止的坏 TeX，检验排版失败时是否保留原式和整篇文字；它不是允许执行命令的入口。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"01 · 正常公式仍正常显示"}]},{"type":"math","tex":"E=mc^2","display":true,"math":{"tag":"mrow","children":[{"tag":"mi","text":"E"},{"tag":"mo","text":"="},{"tag":"mi","text":"m"},{"tag":"msup","children":[{"tag":"mi","text":"c"},{"tag":"mn","text":"2"}]}]}},{"type":"paragraph","children":[{"type":"text","text":"这条公式用于排版对照，不在本示例中讨论它的物理适用条件。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"02 · 有界坏 TeX 保留原文"}]},{"type":"paragraph","children":[{"type":"text","text":"下面故意少写一个右花括号。它没有链接、HTML、样式、加载或宏定义命令；解析失败时应显示可读降级，并保留原 TeX，不能吞掉后面的文字。"}]},{"type":"math","tex":"\\frac{x}{","display":true,"math":{"tag":"mtext","text":"公式排版失败，保留 TeX：\\frac{x}{"}},{"type":"paragraph","children":[{"type":"text","text":"坏公式后面的正文仍然存在。局部公式排版失败不等于整篇文档被拒绝，也不说明原 TeX 已被修正。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"03 · 其他公式与尾部保留"}]},{"type":"math","tex":"1+1=2","display":true,"math":{"tag":"mrow","children":[{"tag":"mn","text":"1"},{"tag":"mo","text":"+"},{"tag":"mn","text":"1"},{"tag":"mo","text":"="},{"tag":"mn","text":"2"}]}},{"type":"paragraph","children":[{"type":"text","text":"正常公式、首段和最后一段都应保留。禁止命令走硬拒绝路径，由 G08 的固定边界检查单独演示，不与这里的安全降级混在一起。"}]},{"type":"paragraph","children":[{"type":"text","text":"安全降级示例结束。完整复制应包含原始坏 TeX、两条正常公式和这句末尾文字。"}]}]}],"viewVersion":1,"mode":"document","documentVersion":1,"sourceHash":"6d5317eeb15a3c6c","callouts":{}},"text":"# 一处公式排版失败，正文仍应完整可读\n\n安全降级示例开始。这里使用一条有界、非禁止的坏 TeX，检验排版失败时是否保留原式和整篇文字；它不是允许执行命令的入口。\n\n\n## 01 · 正常公式仍正常显示\n\n\\[E=mc^2\\]\n这条公式用于排版对照，不在本示例中讨论它的物理适用条件。\n\n\n## 02 · 有界坏 TeX 保留原文\n下面故意少写一个右花括号。它没有链接、HTML、样式、加载或宏定义命令；解析失败时应显示可读降级，并保留原 TeX，不能吞掉后面的文字。\n\n\n\\[\\frac{x}{\\]\n坏公式后面的正文仍然存在。局部公式排版失败不等于整篇文档被拒绝，也不说明原 TeX 已被修正。\n\n\n## 03 · 其他公式与尾部保留\n\n\\[1+1=2\\]\n正常公式、首段和最后一段都应保留。禁止命令走硬拒绝路径，由 G08 的固定边界检查单独演示，不与这里的安全降级混在一起。\n\n安全降级示例结束。完整复制应包含原始坏 TeX、两条正常公式和这句末尾文字。"},{"id":"G08","title":"错误、安全边界与测验隔离","mode":"boundary","goal":"辨认真实编译拒绝、客户端 View 拒绝、安全原生 fallback 与未提交测验隔离。","instructions":"阅读各项边界检查结果与明确标注的原生 fallback；在下面的小测验选择、提交，再重试或切换场景。","expected":"五类非法输入被真实编译拒绝；篡改 View 被客户端拒绝；工具不可用显示完整安全原生 fallback。测验必须真实提交才评分。","limitations":"非法输入不是成功文档。工具不可用是受限本地故障模拟；没有调用 MCP 或真实 ChatGPT 宿主。","view":{"schemaVersion":1,"contentId":"gallery-g08-quiz-v1","title":"真实小测验：提交后才显示评分","facts":{},"blocks":[{"id":"d_6de397624bc655b6_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"测验开始。先选择一个选项，再提交；可以重试。本题是固定合成计数，不来自任何用户记录。"}]}]},{"id":"d_quiz_0ad397d40852013e_0","kind":"component","type":"quiz","data":{"questions":[{"id":"independent-counts","prompt":"两组记录分别有 4 条和 3 条，彼此没有重叠，共有多少条？","options":[{"id":"a","label":"5 条"},{"id":"b","label":"7 条"},{"id":"c","label":"8 条"}]}]}},{"id":"d_c4ecbca30d6de395_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"测验结束。未提交时只显示题干和选项；复制不会包含评分键或解析。"}]}]}],"viewVersion":1,"mode":"document","documentVersion":1,"sourceHash":"f225f57ff28e71a9","callouts":{},"deliveryId":"40552fda-ebf2-4631-a15b-1f58428eb109"},"text":"# 真实小测验：提交后才显示评分\n\n测验开始。先选择一个选项，再提交；可以重试。本题是固定合成计数，不来自任何用户记录。\n\n\n\n1. 两组记录分别有 4 条和 3 条，彼此没有重叠，共有多少条？\n   a. 5 条\n   b. 7 条\n   c. 8 条\n请选择各题答案；提交后再判断正确性和解释。\n\n测验结束。未提交时只显示题干和选项；复制不会包含评分键或解析。","_meta":{"chatui":{"quizGrading":{"version":1,"contentId":"gallery-g08-quiz-v1","deliveryId":"40552fda-ebf2-4631-a15b-1f58428eb109","sourceHash":"f225f57ff28e71a9","viewHash":"f225f57ff28e71a9","quizzes":[{"id":"d_quiz_0ad397d40852013e_0","questions":[{"id":"independent-counts","correct":"b","explanation":"两组互不重叠时才能直接相加；4+3=7。"}]}]}}},"hasQuiz":true,"checks":[{"id":"illegal-dsl","label":"非法 DSL 指令","status":"rejected","message":"此固定非法输入已被真实编译器拒绝；危险原文不进入展示。"},{"id":"dangerous-key","label":"危险对象键","status":"rejected","message":"此固定非法输入已被真实编译器拒绝；危险原文不进入展示。"},{"id":"unsafe-url","label":"危险 URL","status":"rejected","message":"此固定非法输入已被真实编译器拒绝；危险原文不进入展示。"},{"id":"budget-exceeded","label":"正文预算超限","status":"rejected","message":"此固定非法输入已被真实编译器拒绝；危险原文不进入展示。"},{"id":"forbidden-tex","label":"禁止 TeX 命令","status":"rejected","message":"此固定非法输入已被真实编译器拒绝；危险原文不进入展示。"},{"id":"client-view","label":"客户端 View 校验","status":"rejected","message":"build 检查与浏览器客户端独立拒绝；不挂载该 View。"},{"id":"tool-unavailable","label":"工具不可用 · 安全原生 fallback（本地故障模拟）","status":"fallback","message":"本地模拟工具不可用；以下是同一固定输入的完整安全原生文本。"}],"clientProbe":{"schemaVersion":1,"contentId":"gallery-g08-client","title":"客户端拒绝的安全回退","facts":{},"blocks":[{"id":"d_b26085c459cbdc9c_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"客户端回退开始。"}]},{"type":"paragraph","children":[{"type":"text","text":"这是先经过真实编译的固定合法文档；视图随后被故意篡改。拒绝后保留这份同源安全全文。"}]},{"type":"paragraph","children":[{"type":"text","text":"客户端回退结束。"}]}]}],"viewVersion":1,"mode":"document","documentVersion":1,"sourceHash":"fafd46eb23b406c7","callouts":{"invalid":"untrusted-tone"}},"toolFallback":"# 工具不可用时仍可读的全文\n\n原生 fallback 开始。\n\n工具不可用时，显示与同一固定输入对应的完整安全文字。它不声称富文档渲染成功，也不输出危险输入或内部异常。\n\n原生 fallback 结束。"},{"id":"G09","title":"参数、图形与结果表的组合 Document","mode":"document","goal":"用同一实验状态核对图形、数值、表格与语义。","instructions":"输入 1.5 和 1.2345，检查图形与结果表；尝试空值和越界值，再重置并展开推导。","expected":"q=1.5 时 h=3 cm、b=2√3 cm、A=3√3 cm²；重置恢复 q=1、A=4 cm²。","limitations":"固定最优推导不随实验改写；复制是初始文档。真实宿主状态恢复未验证。","view":{"schemaVersion":1,"contentId":"gallery-g09-iteration1-v1","title":"圆内三角形：固定推导与当前实验","facts":{},"blocks":[{"id":"d_5d75e73cd994cd52_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"这篇数学 Document 将连续正文、公式、可操作参数、图形、结果表和折叠推导放在同一阅读流中。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"固定题设"}]},{"type":"paragraph","children":[{"type":"text","text":"圆半径固定为 r=2 cm，求圆内接等腰三角形的最大面积。顶点在圆顶，底边为水平弦，高度为 h。令 q=h/r。解析定义域为 0\u003cq\u003c2。"}]},{"type":"math","tex":"A(q)=r^2q\\sqrt{2q-q^2}","display":true,"math":{"tag":"mrow","children":[{"tag":"mi","text":"A"},{"tag":"mo","attrs":{"stretchy":"false"},"text":"("},{"tag":"mi","text":"q"},{"tag":"mo","attrs":{"stretchy":"false"},"text":")"},{"tag":"mo","text":"="},{"tag":"msup","children":[{"tag":"mi","text":"r"},{"tag":"mn","text":"2"}]},{"tag":"mi","text":"q"},{"tag":"msqrt","children":[{"tag":"mrow","children":[{"tag":"mn","text":"2"},{"tag":"mi","text":"q"},{"tag":"mo","text":"−"},{"tag":"msup","children":[{"tag":"mi","text":"q"},{"tag":"mn","text":"2"}]}]}]}]}},{"type":"paragraph","children":[{"type":"text","text":"原题的最优值固定在 q=3/2，此时 h=3 cm、底边 b=2√3 cm，最大面积 Amax=3√3 cm²。下方实验不会改写这个结论。"}]},{"type":"heading","level":2,"children":[{"type":"text","text":"当前实验"}]},{"type":"paragraph","children":[{"type":"text","text":"初始 q=1，h=2 cm、b=4 cm、A=4 cm²。可拖动滑块，也可精确输入 q=1.5 或 1.2345。图形、读数和结果表使用同一份当前状态。空值或越界输入会提示错误，并保留上次有效图形。重置回 q=1。"}]}]},{"id":"d_aab71b428d2c8924_0","kind":"component","type":"geometry","data":{"radius":2,"heightRatio":1,"unit":"cm"}},{"id":"d_ed1ccbb24e8b2f3c_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"当前实验不等于原题已改写；比较实验结果与上面的固定最大值即可检验模型。结果表明确标为“当前实验结果”，所有显示舍入都使用约等号。"}]}]},{"id":"d_9298c07dba0204ff_0","kind":"collapse","summary":"推导与限制（固定题设）","blocks":[{"id":"d_f6e6c360b160a48e_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"在正数定义域内，最大化 A 等价于最大化 A²。令 f(q)=q²(2q−q²)，则 f′(q)=2q²(3−2q)。在 0\u003cq\u003c2 内，导数在 q=3/2 处由正变负；边界面积趋于零。"}]},{"type":"math","tex":"A_{\\max}=\\frac{3\\sqrt{3}}{4}r^2=3\\sqrt{3}\\;\\mathrm{cm}^2","display":true,"math":{"tag":"mrow","children":[{"tag":"msub","children":[{"tag":"mi","text":"A"},{"tag":"mi","text":"max"},{"tag":"mo","text":"⁡"}]},{"tag":"mo","text":"="},{"tag":"mfrac","children":[{"tag":"mrow","children":[{"tag":"mn","text":"3"},{"tag":"msqrt","children":[{"tag":"mn","text":"3"}]}]},{"tag":"mn","text":"4"}]},{"tag":"msup","children":[{"tag":"mi","text":"r"},{"tag":"mn","text":"2"}]},{"tag":"mo","text":"="},{"tag":"mn","text":"3"},{"tag":"msqrt","children":[{"tag":"mn","text":"3"}]},{"tag":"mtext","text":"  "},{"tag":"msup","children":[{"tag":"mrow","children":[{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"c"},{"tag":"mi","attrs":{"mathvariant":"normal"},"text":"m"}]},{"tag":"mn","text":"2"}]}]}},{"type":"paragraph","children":[{"type":"text","text":"滑块只覆盖 0.05≤q≤1.95，避免退化端点。直接输入使用同一范围。本文只研究上述固定圆与等腰三角形模型，没有声称适用于任意多边形。"}]}]}]},{"id":"d_1f63c406a43c4844_0","kind":"prose","nodes":[{"type":"paragraph","children":[{"type":"text","text":"完整文档到此结束。全文复制保留题设、初始实验结果和折叠推导；它不会冒充当前操作状态的导出。"}]}]}],"viewVersion":1,"mode":"document","documentVersion":1,"sourceHash":"09fde9c82b15c21c","callouts":{}},"text":"# 圆内三角形：固定推导与当前实验\n\n这篇数学 Document 将连续正文、公式、可操作参数、图形、结果表和折叠推导放在同一阅读流中。\n\n\n## 固定题设\n圆半径固定为 r=2 cm，求圆内接等腰三角形的最大面积。顶点在圆顶，底边为水平弦，高度为 h。令 q=h/r。解析定义域为 0\u003cq\u003c2。\n\n\n\\[A(q)=r^2q\\sqrt{2q-q^2}\\]\n原题的最优值固定在 q=3/2，此时 h=3 cm、底边 b=2√3 cm，最大面积 Amax=3√3 cm²。下方实验不会改写这个结论。\n\n\n## 当前实验\n初始 q=1，h=2 cm、b=4 cm、A=4 cm²。可拖动滑块，也可精确输入 q=1.5 或 1.2345。图形、读数和结果表使用同一份当前状态。空值或越界输入会提示错误，并保留上次有效图形。重置回 q=1。\n\n\n\n圆内接三角形实验：半径 r=2 cm，初始高度 h/r=1。\n底边 b=2√(2rh−h²)，面积 A=h√(2rh−h²)。\n初始实验结果：高度 2 cm；半底边 2 cm；底边 4 cm；面积 4 cm²。\n滑块或精确输入范围 0.05≤h/r≤1.95；结果表随当前实验联动，重置恢复初始值。固定推导与全文复制保留初始题设。\n\n当前实验不等于原题已改写；比较实验结果与上面的固定最大值即可检验模型。结果表明确标为“当前实验结果”，所有显示舍入都使用约等号。\n\n\n\n推导与限制（固定题设）\n在正数定义域内，最大化 A 等价于最大化 A²。令 f(q)=q²(2q−q²)，则 f′(q)=2q²(3−2q)。在 0\u003cq\u003c2 内，导数在 q=3/2 处由正变负；边界面积趋于零。\n\n\n\\[A_{\\max}=\\frac{3\\sqrt{3}}{4}r^2=3\\sqrt{3}\\;\\mathrm{cm}^2\\]\n滑块只覆盖 0.05≤q≤1.95，避免退化端点。直接输入使用同一范围。本文只研究上述固定圆与等腰三角形模型，没有声称适用于任意多边形。\n\n\n\n完整文档到此结束。全文复制保留题设、初始实验结果和折叠推导；它不会冒充当前操作状态的导出。"},{"id":"G10","title":"基础输入表单与提交快照","mode":"document","goal":"让输入、选择、校验、提交和重置形成可操作闭环。","instructions":"先提交空表单，再填写所有类型并提交；修改、恢复、重置，检查焦点与状态。","expected":"必填错误可定位；提交产生带类型的快照；修改后回到草稿；重置恢复初始值。","limitations":"提交不写服务器。草稿保存在 private widget state，只有显式提交可进入模型上下文；宿主同步待测。","view":{"schemaVersion":1,"contentId":"gallery-g10-iteration1-v1","title":"实验记录：填写、校验与提交快照","facts":{},"blocks":[{"id":"d_aae0e7aeddea30ec_0","kind":"prose","nodes":[{"type":"heading","level":2,"children":[{"type":"text","text":"记录当前观察"}]},{"type":"paragraph","children":[{"type":"text","text":"这个合成表单适合收集一次实验的名称、样本数、观察方式和备注。提交会在当前界面生成带类型的快照，不写入服务器。编辑中的值仅用于界面恢复；显式提交后，宿主支持时可把快照同步给对话。"}]}]},{"id":"d_c75a359996aa851f_0","kind":"component","type":"input-form","data":{"fields":[{"id":"title","type":"text","label":"实验名称","required":true,"maxLength":80,"hint":"例如：三角形面积观察"},{"id":"samples","type":"number","label":"样本数量","value":4,"required":true,"min":1,"max":100},{"id":"method","type":"select","label":"观察方法","required":true,"options":[{"value":"direct","label":"直接观察"},{"value":"compare","label":"对比记录"}]},{"id":"condition","type":"radio","label":"条件","value":"fixed","options":[{"value":"fixed","label":"固定题设"},{"value":"trial","label":"当前实验"}]},{"id":"checked","type":"checkbox","label":"已核对单位","required":true},{"id":"notes","type":"textarea","label":"观察记录","maxLength":300}],"note":"提交只生成当前界面的快照；修改后需要重新提交。"}},{"id":"d_caa2d6357f76bd89_0","kind":"prose","nodes":[{"type":"heading","level":2,"children":[{"type":"text","text":"操作与恢复"}]},{"type":"paragraph","children":[{"type":"text","text":"先提交空表单，焦点应转到第一个错误。补齐必填项后提交，检查数字与布尔值。修改任一字段会撤销已提交状态；重置恢复初始草稿。Gallery 的“重新载入”可验证本页内恢复。全文复制保留初始表单定义，不包含操作后的草稿或提交结果。"}]},{"type":"paragraph","children":[{"type":"text","text":"完整表单示例到此结束。"}]}]}],"viewVersion":1,"mode":"document","documentVersion":1,"sourceHash":"aedea9bc392b2c7a","callouts":{}},"text":"# 实验记录：填写、校验与提交快照\n\n\n## 记录当前观察\n这个合成表单适合收集一次实验的名称、样本数、观察方式和备注。提交会在当前界面生成带类型的快照，不写入服务器。编辑中的值仅用于界面恢复；显式提交后，宿主支持时可把快照同步给对话。\n\n\n\n输入表单：草稿由宿主组件状态支持恢复；提交生成输入快照，并可将输入值提供模型上下文。\n实验名称（text，必填）：初始值 未填写；最多 80 字符；例如：三角形面积观察\n样本数量（number，必填）：初始值 4；范围 1 至 100\n观察方法（select，必填）：初始值 未填写；选项 直接观察 (direct)、对比记录 (compare)\n条件（radio）：初始值 fixed；选项 固定题设 (fixed)、当前实验 (trial)\n已核对单位（checkbox，必填）：初始值 未填写\n观察记录（textarea）：初始值 未填写；最多 300 字符\n填写后可提交、重置；这里的全文复制保留初始表单定义，不包含操作后的草稿或提交结果。\n提交只生成当前界面的快照；修改后需要重新提交。\n\n\n## 操作与恢复\n先提交空表单，焦点应转到第一个错误。补齐必填项后提交，检查数字与布尔值。修改任一字段会撤销已提交状态；重置恢复初始草稿。Gallery 的“重新载入”可验证本页内恢复。全文复制保留初始表单定义，不包含操作后的草稿或提交结果。\n\n完整表单示例到此结束。"}]}</script><script>/* Fixed-data Gallery host, with no MCP or ChatGPT APIs. */
(() => {
  'use strict';
  const node = document.getElementById('gallery-data');
  const data = JSON.parse(node.textContent); node.remove();
  const choices = data.scenarios;
  const params = new URLSearchParams(location.search);
  const status = document.getElementById('gallery-status');
  const stage = document.getElementById('gallery-stage');
  const states = new Map();
  let active = null, generation = 0;
  const diagnostics = { accepted: 0, rejectedMessages: 0, generation: 0, stateOperations: 0, clientRejections: 0, mounts: [] };
  Object.defineProperty(window, '__galleryDiagnostics', { get: () => JSON.parse(JSON.stringify(diagnostics)) });
  const plain = value => value && typeof value === 'object' && !Array.isArray(value) && Object.getPrototypeOf(value) === Object.prototype;
  const safe = (value, depth = 0) => {
    if (depth > 24) return false;
    if (value === null || ['string', 'number', 'boolean'].includes(typeof value)) return (typeof value !== 'number' || Number.isFinite(value)) && (typeof value !== 'string' || value.length <= 65536);
    if (Array.isArray(value)) return value.length <= 128 && value.every(item => safe(item, depth + 1));
    return plain(value) && Object.keys(value).length <= 128 && Object.entries(value).every(([key, item]) => !['__proto__', 'constructor', 'prototype'].includes(key) && safe(item, depth + 1));
  };
  const send = (owner, op, payload = {}) => owner.frame.contentWindow.postMessage({ channel: 'chatui-offline-v1', nonce: owner.nonce, op, ...payload }, '*');
  function destroy() {
    if (!active) return;
    const owner = active; active = null;
    send(owner, 'destroy'); owner.frame.remove();
    window.removeEventListener('message', owner.receive);
    owner.requests.clear();
  }
  function select(id, restore = false) {
    destroy(); generation++; diagnostics.generation = generation;
    const scenario = choices.find(item => item.id === id) || choices[0];
    stage.replaceChildren();
    document.body.dataset.currentScene = scenario.id;
    document.body.dataset.status = 'loading';
    document.getElementById('scene-title').textContent = `${scenario.id} · ${scenario.title}`;
    for (const key of ['goal', 'instructions', 'expected', 'limitations']) document.getElementById(key).textContent = scenario[key];
    document.getElementById('actual-mode').textContent = scenario.mode;
    document.querySelectorAll('[data-scene]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.scene === scenario.id)));
    if (scenario.checks) {
      const list = document.createElement('ul'); list.id = 'boundary-results';
      for (const check of scenario.checks) {
        const item = document.createElement('li'); item.dataset.check = check.id; item.dataset.status = check.status;
        item.textContent = `${check.label}：${check.status === 'rejected' ? '已真实拒绝' : '安全原生 fallback'} · ${check.message}`;
        list.append(item);
      }
      stage.append(list);
      if (scenario.toolFallback) {
        const fallback = document.createElement('pre'); fallback.id = 'tool-fallback'; fallback.textContent = scenario.toolFallback;
        stage.append(fallback);
      }
    }
    if (!scenario.view) {
      const pre = document.createElement('p'); pre.id = 'native-text'; pre.textContent = scenario.text;
      stage.append(pre); status.textContent = '静态原生文本参考已就绪；未调用 Document 或真实聊天宿主。';
      document.body.dataset.status = 'native';
      document.getElementById('reload').disabled = true; document.getElementById('reset').disabled = true;
      return;
    }
    document.getElementById('reload').disabled = false; document.getElementById('reset').disabled = false;
    const frame = document.createElement('iframe'); frame.id = 'gallery-frame'; frame.title = `${scenario.id} 可信离线文档`;
    frame.setAttribute('sandbox', 'allow-scripts'); frame.setAttribute('referrerpolicy', 'no-referrer');
    const nonce = Array.from(crypto.getRandomValues(new Uint8Array(24)), byte => byte.toString(16).padStart(2, '0')).join('');
    const owner = { frame, nonce, scenario, generation, requests: new Set(), initialized: false, lastRequest: 0 };
    owner.receive = async event => {
      if (active !== owner || event.source !== frame.contentWindow) { diagnostics.rejectedMessages++; return; }
      const message = event.data;
      if (!plain(message) || message.channel !== 'chatui-offline-v1' || message.nonce !== nonce || !safe(message) || JSON.stringify(message).length > 70000) { diagnostics.rejectedMessages++; return; }
      const allowed = { hello: [], size: ['height'], ready: ['mountMs'], state: ['state'], copy: ['id', 'text'], navigate: ['id', 'top', 'height'], rejected: [], 'client-rejected': [] };
      const keys = Object.hasOwn(allowed, message.op) ? allowed[message.op] : null;
      if (!keys || Object.keys(message).length !== keys.length + 3 || keys.some(key => !Object.hasOwn(message, key)) || (message.op !== 'hello' && !owner.initialized)) { diagnostics.rejectedMessages++; return; }
      if (message.op === 'hello') {
        if (owner.initialized) { diagnostics.rejectedMessages++; return; }
        owner.initialized = true;
        send(owner, 'init', { view: scenario.view, text: scenario.text, theme: document.getElementById('theme').value,
          ...(scenario._meta ? { _meta: scenario._meta } : {}),
          ...(restore && !scenario.hasQuiz && states.has(scenario.id) ? { state: states.get(scenario.id) } : {}),
          ...(scenario.clientProbe ? { clientProbe: scenario.clientProbe } : {}) });
      } else if (message.op === 'size') {
        if (Number.isFinite(message.height) && message.height > 0 && message.height <= 50000) frame.style.height = `${message.height}px`;
        else diagnostics.rejectedMessages++;
      } else if (message.op === 'ready') {
        if (!Number.isFinite(message.mountMs) || message.mountMs < 0 || message.mountMs > 60000) { diagnostics.rejectedMessages++; return; }
        document.body.dataset.status = scenario.mode === 'boundary' ? 'rejection' : 'ready';
        status.textContent = scenario.mode === 'boundary' ? '安全边界已真实拒绝；下方 Quiz 是独立正常文档。' : '已就绪 · 真实可信 Renderer · 本地固定数据';
        diagnostics.mounts.push({ scene: scenario.id, mountMs: message.mountMs }); if (diagnostics.mounts.length > 100) diagnostics.mounts.shift();
      } else if (message.op === 'client-rejected') diagnostics.clientRejections++;
      else if (message.op === 'rejected') { document.body.dataset.status = 'rejection'; status.textContent = '客户端拒绝；保留安全原生 fallback。'; }
      else if (message.op === 'state') {
        if (JSON.stringify(message.state).length > 65536 || !plain(message.state)) { diagnostics.rejectedMessages++; return; }
        // Quiz grading and answers stay in the trusted frame, never in host messages/storage.
        if (!scenario.hasQuiz) states.set(scenario.id, message.state);
        diagnostics.stateOperations++;
      } else if (message.op === 'navigate') {
        // This is the Gallery's own scroll container, never a ChatGPT parent DOM.
        if (!Number.isSafeInteger(message.id) || message.id <= owner.lastRequest || message.id > 100000 ||
          !Number.isFinite(message.top) || !Number.isFinite(message.height) || message.top < 0 || message.height <= 0 ||
          message.top + message.height > frame.clientHeight + 2) { diagnostics.rejectedMessages++; return; }
        owner.lastRequest = message.id; owner.requests.add(message.id);
        window.scrollTo({ top: window.scrollY + frame.getBoundingClientRect().top + message.top - 16, behavior: 'instant' });
        // Acknowledgement reflects the actual visible position after scrolling.
        await new Promise(resolve => setTimeout(resolve, 0));
        if (active !== owner || !owner.requests.delete(message.id)) return;
        const top = frame.getBoundingClientRect().top + message.top;
        send(owner, 'navigate-result', { id: message.id, ok: top >= -1 && top + message.height <= window.innerHeight + 1 });
      } else if (message.op === 'copy') {
        if (!Number.isSafeInteger(message.id) || message.id <= owner.lastRequest || message.id > 100000 || message.text !== scenario.text) { diagnostics.rejectedMessages++; return; }
        owner.lastRequest = message.id; owner.requests.add(message.id);
        let ok = false;
        try { if (typeof navigator.clipboard?.writeText !== 'function') throw new Error('Unavailable'); await navigator.clipboard.writeText(scenario.text); ok = true; } catch { /* Frame provides the complete manual fallback. */ }
        if (active !== owner || !owner.requests.delete(message.id)) return;
        send(owner, 'copy-result', { id: message.id, ok });
      }
      diagnostics.accepted++;
    };
    active = owner; window.addEventListener('message', owner.receive);

    stage.append(frame); status.textContent = '正在载入可信离线文档…';
  }
  const sceneLabels = { G01: '几何', G02: '积分', G03: '物理', G04: '论证', G05: '长文', G06: '短答', G07: '降级', G08: '边界', G09: '参数', G10: '表单' };
  for (const scenario of choices) {
    const button = document.createElement('button'); button.type = 'button'; button.dataset.scene = scenario.id;
    button.textContent = `${scenario.id} ${sceneLabels[scenario.id] || scenario.title}`;
    button.setAttribute('aria-label', `${scenario.id} · ${scenario.title}`); button.title = scenario.title;
    button.addEventListener('click', () => select(scenario.id)); document.getElementById('scenes').append(button);
  }
  const theme = document.getElementById('theme'); theme.value = params.get('theme') === 'dark' ? 'dark' : 'light';
  const width = document.getElementById('width'); width.value = ['320', '390', '768', '1024'].includes(params.get('width')) ? params.get('width') : '768';
  const applyWidth = () => document.documentElement.style.setProperty('--gallery-width', `${width.value}px`);
  applyWidth(); width.addEventListener('change', applyWidth);
  theme.addEventListener('change', () => {
    document.documentElement.style.colorScheme = theme.value;
    // Keep the trusted live Quiz instance; no answers or grading leave the frame.
    if (active?.initialized) send(active, 'theme', { theme: theme.value });
  });
  document.documentElement.style.colorScheme = theme.value;
  document.getElementById('reload').addEventListener('click', () => select(document.body.dataset.currentScene, true));
  document.getElementById('reset').addEventListener('click', () => { states.delete(document.body.dataset.currentScene); select(document.body.dataset.currentScene); });
  window.addEventListener('pagehide', destroy, { once: true });
  select(params.get('scene') || 'G01');
})();
