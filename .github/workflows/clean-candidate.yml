name: ChatUI clean candidate verification
on:
  push:
    # The temporary acceptance branch is push-only; do not open PRs from it.
    branches: [main, ci/clean-root-v5-20261102]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Record candidate identity
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          node --version
          npm --version
          python3 --version
      - name: Install official Ubuntu CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk=1:20230817+repack1-3 fontconfig
          fc-cache -f
          dpkg-query -W fonts-noto-cjk fontconfig
      - name: Install pinned Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-phase3.txt
      - name: Verify runtime dependencies and actual font coverage
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/chatui-matplotlib
        run: |
          python3 -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          python3 -m pip check
          python3 .github/scripts/check-runtime.py
      - name: Full release verification including original input integrity
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/chatui-matplotlib
        run: python3 scripts/reproduce-package.py
