  const heading = () => config.title ? el('h3', 'cui-title', config.title) : null;
  const panel = () => el('section', 'cui-panel cui-stack');
  const finiteFormat = value => new Intl.NumberFormat('zh-CN', {
    maximumFractionDigits: 2,
    notation: value !== 0 && (Math.abs(value) < .01 || Math.abs(value) >= 1e6) ? 'scientific' : 'standard'
  }).format(value);
  const fingerprint = value => {
    const serialized = JSON.stringify(value);
    let hash = 2166136261;
    for (let i = 0; i < serialized.length; i++) hash = Math.imul(hash ^ serialized.charCodeAt(i), 16777619);
    return (hash >>> 0).toString(16) + ':' + serialized.length;
  };
  let identity = '';
  const stateEnvelope = candidate => {
    const state = candidate && candidate.privateContent && candidate.privateContent.chatui;
    return state && state.schemaVersion === 1 && state.identity === identity ? state.value : null;
  };
  const saveState = (value, modelContent) => {
    if (disposed) return;
    if (typeof window.openai?.setWidgetState !== 'function') return;
    const payload = { modelContent, privateContent: { chatui: { schemaVersion: 1, identity, value } } };
    if (JSON.stringify(payload).length > 15000) return;
    try { Promise.resolve(window.openai.setWidgetState(payload)).catch(() => {}); } catch (_) { /* State remains usable locally. */ }
  };
  const geometry = data => {
    require(number(data.radius) && data.radius > 0, '圆半径必须为正数。');
    const radius = data.radius;
    // A(q)=r²q√(2q−q²) has its minimum on [.05,1.95] at q=.05.
    // Require a normal binary64 area throughout that continuous interval;
    // a merely positive subnormal area can already lose relative precision.
    const minimumRatio = .05;
    const minimumArea = (minimumRatio * radius) * (radius * Math.sqrt(2 * minimumRatio - minimumRatio * minimumRatio));
    require(number(2 * radius * radius) && radius * radius > 0 && minimumArea >= 2 ** -1022, '半径超出可精确计算的数值范围，请换用合适单位。');
    const initialRatio = number(data.heightRatio) && data.heightRatio >= .05 && data.heightRatio <= 1.95 ? data.heightRatio : 1.5;
    const clean = value => number(value?.heightRatio) && value.heightRatio >= .05 && value.heightRatio <= 1.95 ? value.heightRatio : initialRatio;
    let heightRatio = clean(stateEnvelope(window.openai?.widgetState) || { heightRatio: data.heightRatio });
    const content = el('section', 'cui-stack');
    const svg = el('svg', 'cui-svg', undefined, SVG_NS);
    svg.setAttribute('role', 'img');
    const label = el('label', 'cui-stack');
    const current = el('span', 'cui-values');
    const input = el('input', 'cui-range');
    input.type = 'range'; input.min = '.05'; input.max = '1.95'; input.step = 'any'; input.value = String(heightRatio);
    input.setAttribute('aria-label', '三角形高度与圆半径之比 h/r');
    append(label, current, input);
    const preciseLabel = el('label', 'cui-stack', '精确输入 h/r（0.05–1.95）');
    const precise = el('input', 'cui-geometry-number'); precise.type = 'number'; precise.min = '.05'; precise.max = '1.95'; precise.step = 'any'; precise.value = String(heightRatio);
    precise.setAttribute('data-geometry-input', ''); precise.setAttribute('aria-label', '精确输入高度比 h/r');
    const inputError = el('p', 'cui-error'); inputError.id = `${root.id}-geometry-error`; inputError.setAttribute('role', 'status'); precise.setAttribute('aria-describedby', inputError.id);
    preciseLabel.append(precise);
    const reset = el('button', 'cui-button', '重置实验'); reset.type = 'button'; reset.setAttribute('data-geometry-reset', '');
    const table = el('table', 'cui-explorer-table'); table.append(el('caption', '', '当前实验结果（随 h/r 联动）'));
    const tbody = el('tbody'); table.append(tbody);
    const cells = new Map();
    for (const [key, name] of [['height', '高度 h'], ['halfBase', '半底边 x'], ['base', '底边 b'], ['area', '面积 A']]) {
      const row = el('tr'), th = el('th', '', name), cell = el('td'); th.scope = 'row'; cell.setAttribute('data-geometry-result', key); cells.set(key, cell); append(row, th, cell); tbody.append(row);
    }
    const values = el('p', 'cui-values');
    const announcement = el('p', 'cui-sr'); announcement.setAttribute('aria-live', 'polite');
    append(content, heading(), svg, label, preciseLabel, inputError, reset, values, table, announcement);
    root.append(content);
    const unit = text(data.unit) || '单位';
    // Keep exact stored values for geometry/state; mark only rounded display text.
    const measure = value => {
      const formatted = finiteFormat(value);
      const rounded = Number(formatted.replaceAll(',', '')) !== value;
      return { equation: `${rounded ? '≈' : '='} ${formatted}`, spoken: `${rounded ? '约' : ''}${formatted}` };
    };
    const point = (x, y, width, height, scale) => [width / 2 + x * scale, height / 2 - y * scale];
    const svgNode = (tag, attributes, contentText) => {
      const node = el(tag, '', contentText, SVG_NS);
      Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, String(value)));
      return node;
    };
    const update = () => {
      const h = heightRatio * radius;
      const x = radius * Math.sqrt(Math.max(0, 2 * heightRatio - heightRatio * heightRatio));
      const area = x * h;
      const width = Math.max(280, Math.floor(svg.getBoundingClientRect().width || root.getBoundingClientRect().width || 360));
      const height = Math.min(600, width + 30);
      const scale = (Math.min(width, height) - 92) / (2 * radius);
      const [ox, oy] = point(0, 0, width, height, scale);
      const a = point(0, radius, width, height, scale);
      const b = point(-x, radius - h, width, height, scale);
      const c = point(x, radius - h, width, height, scale);
      const d = point(0, radius - h, width, height, scale);
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('width', String(width)); svg.setAttribute('height', String(height));
      svg.replaceChildren();
      svg.append(svgNode('title', {}, `半径${measure(radius).spoken}${unit}的圆内等腰三角形`));
      svg.append(svgNode('desc', {}, `顶点A在圆顶，底边BC为水平弦，D为中点，O为圆心。完整高度h=AD，半径r=AO，半底边x=BD=DC，底边b=2x。高度${measure(h).spoken}${unit}，半底边${measure(x).spoken}${unit}，底边${measure(2 * x).spoken}${unit}，面积${measure(area).spoken}平方${unit}。`));
      svg.append(svgNode('circle', { cx: ox, cy: oy, r: radius * scale, class: 'cui-outline' }));
      svg.append(svgNode('polygon', { points: [a, b, c].map(p => p.join(',')).join(' '), class: 'cui-triangle' }));
      svg.append(svgNode('line', { x1: a[0], y1: a[1], x2: d[0], y2: Math.max(d[1], oy), class: 'cui-guide' }));
      svg.append(svgNode('line', { x1: ox, y1: oy, x2: c[0], y2: c[1], class: 'cui-guide' }));
      svg.append(svgNode('line', { x1: b[0], y1: b[1], x2: c[0], y2: c[1], class: 'cui-guide' }));
      // An outside dimension spans exactly A to D without competing with the
      // radius/offset labels on the central line, including at short heights.
      svg.append(svgNode('path', { d: `M 30 ${a[1]} H 24 V ${d[1]} H 30`, class: 'cui-outline', 'data-geometry-segment': 'height' }));
      const heightMidpoint = (a[1] + d[1]) / 2;
      svg.append(svgNode('text', { x: 17, y: heightMidpoint, transform: `rotate(-90 17 ${heightMidpoint})`, 'text-anchor': 'middle', 'data-geometry-measure': 'height' }, 'h = AD'));
      if (Math.abs(d[1] - a[1]) > 24 && x * scale > 24) {
        svg.append(svgNode('polyline', { points: `${d[0]},${d[1] - 14} ${d[0] + 14},${d[1] - 14} ${d[0] + 14},${d[1]}`, class: 'cui-outline' }));
      }
      const makePoint = (name, p, dx, dy, fill) => {
        svg.append(svgNode('circle', { cx: p[0], cy: p[1], r: name === 'O' ? 6 : 5, fill }));
        svg.append(svgNode('text', { x: p[0] + dx, y: p[1] + dy, 'text-anchor': dx < 0 ? 'end' : 'start' }, name));
      };
      makePoint('A', a, 12, -13, 'var(--cui-geometry-mark)');
      makePoint('B', b, -12, 24, 'var(--cui-geometry-mark)');
      makePoint('C', c, 12, 24, 'var(--cui-geometry-mark)');
      makePoint('O', [ox, oy], 14, -12, 'var(--cui-orange-mark)');
      if (Math.abs(d[1] - oy) > 32 && h * scale > 28) makePoint('D', d, 10, heightRatio < 1 ? -12 : 24, 'var(--cui-structure)');
      // A–O and O–C are radii. O–D changes sign when the chord crosses the centre.
      const radiusLabel = svgNode('text', { x: ox + (heightRatio < 1 ? -18 : 18), y: (a[1] + oy) / 2 + 5, 'text-anchor': heightRatio < 1 ? 'end' : 'start', 'data-geometry-measure': 'radius' }, 'r');
      radiusLabel.style.fill = 'var(--cui-blue)';
      if (Math.abs(d[1] - Number(radiusLabel.getAttribute('y'))) > 24) svg.append(radiusLabel);
      else {
        const diagonalLabel = svgNode('text', { x: (ox + c[0]) / 2 + 12, y: (oy + c[1]) / 2 - 8, 'data-geometry-measure': 'radius' }, 'r');
        diagonalLabel.style.fill = 'var(--cui-orange)'; svg.append(diagonalLabel);
      }
      if (Math.abs(d[1] - oy) > 32) {
        const offsetY = (d[1] + oy) / 2 + 5;
        // Above-centre chords can put the offset and half-base labels on the
        // same row. Use the empty space between the two x labels in that case.
        const sharedRow = heightRatio < 1 && x * scale > 76 && Math.abs(offsetY - (d[1] + 27)) < 24;
        const offsetLabel = svgNode('text', { x: sharedRow ? ox - 10 : ox + (heightRatio < 1 ? 18 : -18), y: offsetY, 'text-anchor': sharedRow ? 'middle' : heightRatio < 1 ? 'start' : 'end', 'data-geometry-measure': 'offset' }, heightRatio > 1 ? 'h − r' : 'r − h');
        if (sharedRow) {
          // Keep the central guide from running through the label's glyphs.
          offsetLabel.style.paintOrder = 'stroke'; offsetLabel.style.stroke = 'var(--cui-bg)'; offsetLabel.style.strokeWidth = '3px';
        }
        svg.append(offsetLabel);
      }
      if (x * scale > 76) {
        [b, c].forEach(p => svg.append(svgNode('text', { x: (p[0] + d[0]) / 2, y: d[1] + 27, 'text-anchor': 'middle', 'data-geometry-measure': 'half-base' }, 'x')));
      }
      current.textContent = `高度 h ${measure(h).equation} ${unit} · h/r ${measure(heightRatio).equation}`;
      input.setAttribute('aria-valuetext', `高度${measure(h).spoken}${unit}，h/r为${measure(heightRatio).spoken}`);
      values.textContent = `半径 r ${measure(radius).equation} ${unit}　半底边 x ${measure(x).equation} ${unit}　底边 b=2x ${measure(2 * x).equation} ${unit}　面积 A ${measure(area).equation} ${unit}²`;
      for (const [key, value] of Object.entries({ height: h, halfBase: x, base: 2 * x, area })) { const cell = cells.get(key); cell.dataset.value = String(value); cell.textContent = `${measure(value).equation} ${unit}${key === 'area' ? '²' : ''}`; }
      return { radius, height: h, halfBase: x, area, unit };
    };
    const clearError = () => { precise.setAttribute('aria-invalid', 'false'); inputError.textContent = ''; };
    const persist = () => { const result = update(); announcement.textContent = values.textContent; saveState({ heightRatio }, { component: 'geometry', contentId: config.contentId, ...result }); };
    input.addEventListener('input', () => { heightRatio = Number(input.value); precise.value = String(heightRatio); clearError(); update(); });
    input.addEventListener('change', () => {
      persist();
    });
    precise.addEventListener('input', () => {
      const value = precise.valueAsNumber;
      if (!number(value) || value < .05 || value > 1.95) { precise.setAttribute('aria-invalid', 'true'); inputError.textContent = '请输入 0.05–1.95 内的有限数值；图形和结果保留上次有效值。'; return; }
      heightRatio = value; input.value = String(value); clearError(); update();
    });
    precise.addEventListener('change', () => { if (precise.getAttribute('aria-invalid') !== 'true') persist(); });
    reset.addEventListener('click', () => { heightRatio = initialRatio; input.value = precise.value = String(heightRatio); clearError(); persist(); });
    activeRestore = saved => { heightRatio = clean(saved); input.value = precise.value = String(heightRatio); clearError(); update(); };
    if (typeof ResizeObserver === 'function') { resizeObserver = new ResizeObserver(update); resizeObserver.observe(svg); }
    update();
  };
  try {
    config = JSON.parse(configNode.textContent);
    require(config && config.schemaVersion === 1 && typeof config.contentId === 'string' && config.contentId.length > 0, '配置需要 schemaVersion: 1 和内容标识。');
    require(config.data && typeof config.data === 'object', '配置需要组件数据。');
    identity = config.contentId + ':' + fingerprint(config);
    const renderers = { 'geometry': geometry };
    require(Object.hasOwn(renderers, config.type), '不支持的组件类型。');
    renderers[config.type](config.data);
    window.addEventListener('openai:set_globals', event => {
      activeHostRefresh?.();
      const candidate = event.detail?.globals?.widgetState;
      if (candidate === undefined || !activeRestore) return;
      const saved = stateEnvelope(candidate);
      if (saved !== null) activeRestore(saved);
    });
  } catch (error) {
    if (resizeObserver) resizeObserver.disconnect();
    root.replaceChildren();
    const message = el('p', 'cui-error', '组件未显示：' + (error instanceof Error ? error.message : '请检查配置。'));
    message.setAttribute('role', 'alert'); root.append(message);
  }
})();
</script>
