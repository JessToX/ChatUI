    if (text !== undefined) node.textContent = String(text);
    return node;
  };
  const append = (node, ...children) => { children.filter(Boolean).forEach(child => node.append(child)); return node; };
  const text = value => typeof value === 'string' ? value : '';
  const number = value => typeof value === 'number' && Number.isFinite(value);
  const require = (test, message) => { if (!test) throw new Error(message); };
  const list = value => Array.isArray(value) ? value : [];
  const tone = (node, name) => {
    node.style.setProperty('--cui-tone', colors[name] || colors.blue);
    node.style.setProperty('--cui-mark', marks[name] || marks.blue);
    return node;
  };
  const badge = (label, color = 'blue') => tone(el('span', 'cui-badge', label), color);
  const paragraph = (value, className = '') => value ? el('p', className, value) : null;
  const heading = () => config.title ? el('h3', 'cui-title', config.title) : null;
  const panel = () => el('section', 'cui-panel cui-stack');
  const finiteFormat = value => new Intl.NumberFormat('zh-CN', {
    maximumFractionDigits: 2,
    notation: value !== 0 && (Math.abs(value) < .01 || Math.abs(value) >= 1e6) ? 'scientific' : 'standard'
  }).format(value);
  const fingerprint = value => {
    const serialized = JSON.stringify(value);
    let hash = 2166136261;
    for (let i = 0; i < serialized.length; i++) hash = Math.imul(hash ^ serialized.charCodeAt(i), 16777619);
    return (hash >>> 0).toString(16) + ':' + serialized.length;
  };
  let identity = '';
  const stateEnvelope = candidate => {
    const state = candidate && candidate.privateContent && candidate.privateContent.chatui;
    return state && state.schemaVersion === 1 && state.identity === identity ? state.value : null;
  };
  const saveState = (value, modelContent) => {
    if (disposed) return;
    if (typeof window.openai?.setWidgetState !== 'function') return;
    const payload = { modelContent, privateContent: { chatui: { schemaVersion: 1, identity, value } } };
    if (JSON.stringify(payload).length > 15000) return;
    try { Promise.resolve(window.openai.setWidgetState(payload)).catch(() => {}); } catch (_) { /* State remains usable locally. */ }
  };
  const forceDiagram = data => {
		const mode = data.mode === undefined ? 'numeric' : data.mode;
		require(mode === 'numeric' || mode === 'direction', '受力图模式只能为 numeric 或 direction。');
		const numeric = mode === 'numeric';
		const shortText = (value, maximum) => typeof value === 'string' && value.trim().length > 0 && value.length <= maximum;
		require(shortText(data.body, 120), '请提供受力对象名称（不超过120字符）。');
		require(data.note === undefined || (typeof data.note === 'string' && data.note.length <= 1000), '说明应为不超过1000字符的文本。');
		require(numeric ? data.unit === 'N' : data.unit === undefined, numeric ? '数值受力图统一使用 N；请先换算输入单位。' : '方向示意大小未知，不填写数值单位。');
		const axisAngle = data.axisAngle === undefined ? 0 : data.axisAngle;
		require(number(axisAngle) && Math.abs(axisAngle) <= 360, '坐标轴旋转角必须是 −360° 至 360° 的有限数值。');
		const forces = list(data.forces);
		require(forces.length >= 1 && forces.length <= 12, '受力图需要一至十二个真实作用力。');
		require(new Set(forces.map(force => force?.id)).size === forces.length, '作用力标识不能重复。');
		const fields = new Set(numeric ? ['id', 'label', 'fx', 'fy', 'tone'] : ['id', 'label', 'angle', 'tone']);
		forces.forEach(force => {
			require(force && typeof force === 'object' && !Array.isArray(force), '每个作用力必须是数据对象。');
			require(Object.keys(force).every(key => fields.has(key)), '作用力含不支持的字段；分力和合力由组件计算，不作为新力输入。');
			require(shortText(force.id, 80) && shortText(force.label, 120), '作用力需要简短标识与名称。');
			require(force.tone === undefined || Object.hasOwn(marks, force.tone), '作用力颜色只能为 blue、green、orange 或 neutral。');
			if (numeric) require(number(force.fx) && number(force.fy) && Math.abs(force.fx) <= 1e12 && Math.abs(force.fy) <= 1e12, '力分量必须是绝对值不超过 10¹² N 的有限数值。');
			else require(number(force.angle) && Math.abs(force.angle) <= 360, '方向角必须是 −360° 至 360° 的有限数值。');
		});
		const trig = degrees => {
			const radians = degrees * Math.PI / 180;
			const snap = value => Math.abs(value) < 1e-15 ? 0 : value;
			return { c: snap(Math.cos(radians)), s: snap(Math.sin(radians)) };
		};
		const basis = trig(axisAngle);
		const items = forces.map((force, index) => {
			const direction = numeric ? null : trig(force.angle);
			const fx = numeric ? force.fx : direction.c;
			const fy = numeric ? force.fy : direction.s;
			return { ...force, fx, fy, magnitude: Math.hypot(fx, fy), index: index + 1, tone: force.tone || ['blue', 'green', 'orange'][index % 3] };
		});
		const sum = values => {
			let total = 0, correction = 0;
			values.forEach(value => {
				const next = total + value;
				correction += Math.abs(total) >= Math.abs(value) ? (total - next) + value : (value - next) + total;
				total = next;
			});
			return total + correction;
		};
		const result = numeric ? { fx: sum(items.map(force => force.fx)), fy: sum(items.map(force => force.fy)) } : null;
		if (numeric) result.magnitude = Math.hypot(result.fx, result.fy);
		const maximum = Math.max(...items.map(force => force.magnitude), numeric ? result.magnitude : 0) || 1;
		const clean = saved => ({
			showComponents: saved?.showComponents === true,
			showResultant: saved?.showResultant === true,
			selected: items.some(force => force.id === saved?.selected) ? saved.selected : items[0].id
		});
		const mountSession = Array.from(window.crypto.getRandomValues(new Uint32Array(4)), n => n.toString(16).padStart(8, '0')).join('');
		let issuedRevision = 0;
		const restored = new Map();
		const accept = saved => {
			if (!saved || typeof saved !== 'object' || Array.isArray(saved)
						|| typeof saved.showComponents !== 'boolean' || typeof saved.showResultant !== 'boolean'
						|| !items.some(force => force.id === saved.selected)) return false;
			if (Object.hasOwn(saved, 'restoreOrder')) {
				const order = saved.restoreOrder;
				if (!order || typeof order !== 'object' || Array.isArray(order)
					|| typeof order.session !== 'string' || !/^[a-f0-9]{32}$/.test(order.session)
					|| !Number.isSafeInteger(order.revision) || order.revision < 1
					|| order.session === mountSession || order.revision <= (restored.get(order.session) || 0)) return false;
				if (!restored.has(order.session) && restored.size >= 32) return false;
				restored.set(order.session, order.revision);
			}
			return true;
		};
		const initial = numeric ? stateEnvelope(window.openai?.widgetState) : null;
		let state = clean(accept(initial) ? initial : null);
		const content = el('section', 'cui-stack cui-force');
		const svg = el('svg', 'cui-svg', undefined, SVG_NS);
		svg.setAttribute('role', 'img');
		const axesNote = axisAngle === 0 ? '+x 向右，+y 向上。' : `Fx、Fy 使用全局坐标（+x 向右，+y 向上）；局部 +x′ 从 +x 逆时针旋转 ${finiteFormat(axisAngle)}°，+y′ 再逆时针90°。`;
		const note = numeric ? '编号对应下表；所有真实力按同一比例绘制。' : '仅示方向：箭头等长、大小未知，不能比较大小或推断合力。';
		append(content, heading(), paragraph(`受力对象：${data.body}（二维质点）`), paragraph(axesNote, 'cui-label'), paragraph(note, 'cui-label'), svg);
		const table = el('table', 'cui-force-table');
		table.append(el('caption', '', numeric ? '真实作用力（单位 N；分量使用全局 x、y）' : '真实作用力的方向（从全局 +x 逆时针测量）'));
		const header = el('tr');
		(numeric ? ['作用力', 'Fx', 'Fy', '|F|'] : ['作用力', '方向角']).forEach(label => {
			const cell = el('th', '', label); cell.setAttribute('scope', 'col'); header.append(cell);
		});
		table.append(append(el('thead'), header));
		const tbody = el('tbody');
		items.forEach(force => {
			const row = el('tr'); row.setAttribute('data-real-force-row', force.id);
			const name = el('th'); name.setAttribute('scope', 'row');
			append(name, badge(force.index, force.tone), el('span', '', ` ${force.label}`));
			row.append(name);
			(numeric ? [force.fx, force.fy, force.magnitude] : [force.angle]).forEach(value => row.append(el('td', '', finiteFormat(value) + (numeric ? '' : '°'))));
			tbody.append(row);
		});
		table.append(tbody);
		const projection = el('p', 'cui-values'); projection.setAttribute('data-projection-values', ''); projection.setAttribute('aria-live', 'polite');
		const resultant = el('p', 'cui-values cui-force-result'); resultant.setAttribute('data-force-sum', ''); resultant.setAttribute('aria-live', 'polite');
		let componentToggle, resultToggle, selection, selectionLabel;
		const persist = () => {
			if (issuedRevision >= Number.MAX_SAFE_INTEGER) return;
			const value = { ...state, restoreOrder: { session: mountSession, revision: ++issuedRevision } };
			saveState(value, { component: 'force-diagram', contentId: config.contentId, body: data.body, ...state, resultant: result, unit: 'N' });
		};
		if (numeric) {
			const controls = el('div', 'cui-force-controls'); controls.setAttribute('role', 'group'); controls.setAttribute('aria-label', '受力图显示选项');
			const checkbox = (label, key) => {
				const input = el('input'); input.type = 'checkbox'; input.checked = state[key]; input.setAttribute('data-force-toggle', key);
				input.addEventListener('change', () => { state[key] = input.checked; draw(); persist(); });
				controls.append(append(el('label', 'cui-force-choice'), input, el('span', '', label)));
				return input;
			};
			componentToggle = checkbox('显示所选力的分解', 'showComponents');
			resultToggle = checkbox('显示合力', 'showResultant');
			selectionLabel = el('label', 'cui-force-select');
			selection = el('select'); selection.setAttribute('aria-label', '选择要分解的真实作用力');
			items.forEach(force => { const option = el('option', '', `${force.index} ${force.label}`); option.value = force.id; selection.append(option); });
			selection.value = state.selected;
			selection.addEventListener('change', () => { state.selected = selection.value; draw(); persist(); });
			append(selectionLabel, el('span', 'cui-label', '虚线为数学分解，不是额外作用力；分解不改变合力。'), selection);
			append(content, controls, selectionLabel, projection, resultant);
		}
		const readingNote = el('details', 'cui-data');
		append(readingNote, el('summary', '', '读图说明'), paragraph(numeric ? '零力不画箭头。同向箭头可能重合，极小力和未标出的编号请核对数值表。' : '同向箭头可能重合，完整作用力见上表。'));
		append(content, table, paragraph(text(data.note), 'cui-muted'), readingNote);
		root.append(content);
		const node = (tag, attributes, value) => {
			const item = el(tag, '', value, SVG_NS);
			Object.entries(attributes).forEach(([key, value]) => item.setAttribute(key, String(value)));
			return item;
		};
		const draw = () => {
			const width = Math.max(260, Math.min(1000, Math.floor(svg.getBoundingClientRect().width || root.getBoundingClientRect().width || 360)));
			const height = Math.min(width, 500), cx = width / 2, cy = height / 2;
			const reach = Math.min(width, height) / 2 - 60;
			const project = (fx, fy) => [cx + (fx / maximum) * reach, cy - (fy / maximum) * reach];
			svg.setAttribute('viewBox', `0 0 ${width} ${height}`); svg.setAttribute('width', width); svg.setAttribute('height', height);
			svg.replaceChildren();
			append(svg, node('title', {}, `${data.body}的二维质点受力图`), node('desc', {}, `${note} ${axesNote} 编号与下方作用力表对应。`));
			const defs = node('defs', {});
			Object.entries(marks).forEach(([key, color]) => {
				const marker = node('marker', { id: `${root.id}-force-head-${key}`, markerWidth: 9, markerHeight: 8, refX: 8, refY: 4, orient: 'auto', markerUnits: 'userSpaceOnUse' });
				marker.append(node('path', { d: 'M0,0 L8,4 L0,8 Z', fill: color })); defs.append(marker);
			});
			svg.append(defs);
			const markerURL = key => `url(#${root.id}-force-head-${key})`;
			const axis = (fx, fy, label) => {
				const extent = reach + 25;
				svg.append(node('line', { x1: cx - fx * extent, y1: cy + fy * extent, x2: cx + fx * extent, y2: cy - fy * extent, stroke: 'var(--cui-line)', 'stroke-width': 1.5, 'stroke-dasharray': '3 5', 'marker-end': markerURL('neutral') }));
				svg.append(node('text', { x: cx + fx * (extent + 15), y: cy - fy * (extent + 15) + 4, 'text-anchor': 'middle' }, label));
			};
			axis(basis.c, basis.s, axisAngle === 0 ? '+x' : '+x′');
			axis(-basis.s, basis.c, axisAngle === 0 ? '+y' : '+y′');
			const labels = [];
			const arrow = (fx, fy, kind, color, attributes = {}, label = '') => {
				const [x, y] = project(fx, fy);
				if (Math.hypot(x - cx, y - cy) < .0001) return;
				const line = node('line', { x1: cx, y1: cy, x2: x, y2: y, stroke: marks[color], 'stroke-width': kind === 'resultant' ? 4 : 2.7, 'marker-end': markerURL(color), 'data-force-kind': kind, 'data-fx': fx, 'data-fy': fy, ...attributes });
				if (kind === 'component') line.setAttribute('stroke-dasharray', '6 5');
				if (label) line.append(node('title', {}, label));
				svg.append(line);
				return [x, y];
			};
			if (numeric) {
				selectionLabel.hidden = projection.hidden = !state.showComponents;
				resultant.hidden = !state.showResultant;
				const force = items.find(force => force.id === state.selected);
				const u = force.fx * basis.c + force.fy * basis.s;
				const v = -force.fx * basis.s + force.fy * basis.c;
				projection.setAttribute('data-fx-prime', u); projection.setAttribute('data-fy-prime', v);
				projection.textContent = `${force.index} ${force.label}：Fx′ = ${finiteFormat(u)} N，Fy′ = ${finiteFormat(v)} N。两分量的矢量和仍是原作用力。`;
				if (state.showComponents) {
					arrow(u * basis.c, u * basis.s, 'component', 'orange', { 'data-axis-component': 'x', 'data-projection': u, 'data-parent-force': force.id }, '沿 x′ 的数学分量');
					arrow(-v * basis.s, v * basis.c, 'component', 'orange', { 'data-axis-component': 'y', 'data-projection': v, 'data-parent-force': force.id }, '沿 y′ 的数学分量');
				}
				resultant.setAttribute('data-fx', result.fx); resultant.setAttribute('data-fy', result.fy); resultant.setAttribute('data-magnitude', result.magnitude);
				resultant.textContent = result.magnitude === 0 ? '合力为 0 N；不绘制方向箭头。' : `合力：ΣFx = ${finiteFormat(result.fx)} N，ΣFy = ${finiteFormat(result.fy)} N，大小 ${finiteFormat(result.magnitude)} N。合力由真实作用力相加，不是新增作用力。`;
				if (state.showResultant) arrow(result.fx, result.fy, 'resultant', 'green', {}, '真实作用力的合力');
			}
			items.forEach(force => {
				const tip = arrow(force.fx, force.fy, 'real', force.tone, { 'data-force-id': force.id, 'data-magnitude': numeric ? force.magnitude : 'unknown' }, `${force.index} ${force.label}`);
				if (!tip) return;
				const direction = Math.atan2(force.fy, force.fx);
				let lx, ly, placed = false;
				for (let attempt = 0; attempt < 48; attempt++) {
					const rank = Math.floor(attempt / 2), side = attempt % 2 ? -1 : 1;
					const offset = 14 + (rank % 6) * 24, inward = Math.floor(rank / 6) * 24;
					lx = Math.max(16, Math.min(width - 16, tip[0] + Math.sin(direction) * offset * side - Math.cos(direction) * inward));
					ly = Math.max(16, Math.min(height - 16, tip[1] + Math.cos(direction) * offset * side + Math.sin(direction) * inward));
					if (Math.hypot(lx - cx, ly - cy) > 24 && !labels.some(previous => Math.abs(previous[0] - lx) < 24 && Math.abs(previous[1] - ly) < 22)) { placed = true; break; }
				}
				if (!placed) return;
				labels.push([lx, ly]);
				svg.append(node('circle', { cx: lx, cy: ly, r: 10, fill: 'var(--cui-bg)', stroke: marks[force.tone], 'stroke-width': 1 }));
				svg.append(node('text', { x: lx, y: ly + 4.5, 'text-anchor': 'middle', 'data-force-number': force.index }, force.index));
			});
			svg.append(node('circle', { cx, cy, r: 6, fill: 'var(--cui-fg)', stroke: 'var(--cui-bg)', 'stroke-width': 2, 'data-force-body': '' }));
		};
		if (numeric) activeRestore = saved => {
			if (!accept(saved)) return;
			state = clean(saved); componentToggle.checked = state.showComponents; resultToggle.checked = state.showResultant; selection.value = state.selected; draw();
		};
		if (typeof ResizeObserver === 'function') { resizeObserver = new ResizeObserver(draw); resizeObserver.observe(svg); }
		draw();
  };
  try {
    config = JSON.parse(configNode.textContent);
    require(config && config.schemaVersion === 1 && typeof config.contentId === 'string' && config.contentId.length > 0, '配置需要 schemaVersion: 1 和内容标识。');
    require(config.data && typeof config.data === 'object', '配置需要组件数据。');
    identity = config.contentId + ':' + fingerprint(config);
    const renderers = { 'force-diagram': forceDiagram };
    require(Object.hasOwn(renderers, config.type), '不支持的组件类型。');
    renderers[config.type](config.data);
    window.addEventListener('openai:set_globals', event => {
      activeHostRefresh?.();
      const candidate = event.detail?.globals?.widgetState;
      if (candidate === undefined || !activeRestore) return;
      const saved = stateEnvelope(candidate);
      if (saved !== null) activeRestore(saved);
    });
  } catch (error) {
    if (resizeObserver) resizeObserver.disconnect();
    root.replaceChildren();
    const message = el('p', 'cui-error', '组件未显示：' + (error instanceof Error ? error.message : '请检查配置。'));
    message.setAttribute('role', 'alert'); root.append(message);
  }
})();
</script>
