  const append = (node, ...children) => { children.filter(Boolean).forEach(child => node.append(child)); return node; };
  const text = value => typeof value === 'string' ? value : '';
  const number = value => typeof value === 'number' && Number.isFinite(value);
  const require = (test, message) => { if (!test) throw new Error(message); };
  const list = value => Array.isArray(value) ? value : [];
  const tone = (node, name) => {
    node.style.setProperty('--cui-tone', colors[name] || colors.blue);
    node.style.setProperty('--cui-mark', marks[name] || marks.blue);
    return node;
  };
  const badge = (label, color = 'blue') => tone(el('span', 'cui-badge', label), color);
  const paragraph = (value, className = '') => value ? el('p', className, value) : null;
  const heading = () => config.title ? el('h3', 'cui-title', config.title) : null;
  const panel = () => el('section', 'cui-panel cui-stack');
  const finiteFormat = value => new Intl.NumberFormat('zh-CN', {
    maximumFractionDigits: 2,
    notation: value !== 0 && (Math.abs(value) < .01 || Math.abs(value) >= 1e6) ? 'scientific' : 'standard'
  }).format(value);
  const fingerprint = value => {
    const serialized = JSON.stringify(value);
    let hash = 2166136261;
    for (let i = 0; i < serialized.length; i++) hash = Math.imul(hash ^ serialized.charCodeAt(i), 16777619);
    return (hash >>> 0).toString(16) + ':' + serialized.length;
  };
  let identity = '';
  const stateEnvelope = candidate => {
    const state = candidate && candidate.privateContent && candidate.privateContent.chatui;
    return state && state.schemaVersion === 1 && state.identity === identity ? state.value : null;
  };
  const saveState = (value, modelContent) => {
    if (disposed) return;
    if (typeof window.openai?.setWidgetState !== 'function') return;
    const payload = { modelContent, privateContent: { chatui: { schemaVersion: 1, identity, value } } };
    if (JSON.stringify(payload).length > 15000) return;
    try { Promise.resolve(window.openai.setWidgetState(payload)).catch(() => {}); } catch (_) { /* State remains usable locally. */ }
  };
  const mediaPanel = data => {
    const boundedText = (value, max) => typeof value === 'string' && value.trim().length > 0 && value.length <= max;
    const safeURL = value => {
      if (typeof value !== 'string' || value.length > 2048 || /[\u0000-\u0020\u007f]/.test(value)) return null;
      try { const url = new URL(value); return url.protocol === 'https:' && !url.username && !url.password ? url.href : null; } catch (_) { return null; }
    };
    const items = list(data.items);
    require(items.length >= 1 && items.length <= 6, '图文内容需要一至六个有来源的项目。');
    items.forEach(item => {
      require(item && boundedText(item.title, 120) && boundedText(item.body, 1800), '图片需要简短标题和相邻解释。');
      require(boundedText(item.alt, 400) && boundedText(item.sourceLabel, 200) && safeURL(item.sourceUrl), '图片需要替代文本和有效 HTTPS 来源。');
      require(item.imageUrl === undefined || safeURL(item.imageUrl), '图片地址必须是经过核对的 HTTPS 地址。');
      require(item.caption === undefined || boundedText(item.caption, 500), '图注应为不超过500字符的文本。');
      require(item.credit === undefined || boundedText(item.credit, 300), '图片归属应为不超过300字符的文本。');
    });
    const content = el('section', 'cui-stack cui-media');
    const group = el('div', 'cui-media-list');
    items.forEach((item, index) => {
      const figure = el('figure', 'cui-media-item'); figure.setAttribute('data-media-item', index);
      const side = el('div', 'cui-media-image-side');
      const fallback = el('p', 'cui-media-caption', item.imageUrl ? '图片尚未显示；可通过来源查看。' : '图片未嵌入；可通过来源查看。');
      fallback.setAttribute('role', 'status'); fallback.setAttribute('data-media-fallback', '');
      if (item.imageUrl) {
        const img = el('img', 'cui-media-image'); img.alt = item.alt; img.hidden = true;
        img.referrerPolicy = 'no-referrer'; img.decoding = 'async';
        img.addEventListener('load', () => {
          if (img.naturalWidth > 0) { img.hidden = false; fallback.hidden = true; }
        });
        img.addEventListener('error', () => {
          img.hidden = true; fallback.hidden = false; fallback.textContent = '图片未能显示；来源与说明仍可查看。';
        });
        // Use only the verified original address. No proxy, download or rehosting fallback.
        img.src = safeURL(item.imageUrl); side.append(img);
      }
      append(side, fallback, paragraph(item.caption, 'cui-media-caption'));
      const copy = el('figcaption', 'cui-media-copy');
      const source = el('a', 'cui-media-caption', item.sourceLabel); source.href = safeURL(item.sourceUrl);
      source.target = '_blank'; source.rel = 'noopener noreferrer'; source.setAttribute('aria-label', `${item.title}的来源：${item.sourceLabel}`);
      append(copy, el('h4', '', item.title), paragraph(item.body), source, paragraph(item.credit, 'cui-media-caption'));
      append(figure, side, copy); group.append(figure);
    });
    append(content, heading(), group); root.append(content);
  };
  try {
    config = JSON.parse(configNode.textContent);
    require(config && config.schemaVersion === 1 && typeof config.contentId === 'string' && config.contentId.length > 0, '配置需要 schemaVersion: 1 和内容标识。');
    require(config.data && typeof config.data === 'object', '配置需要组件数据。');
    identity = config.contentId + ':' + fingerprint(config);
    const renderers = { 'media-panel': mediaPanel };
    require(Object.hasOwn(renderers, config.type), '不支持的组件类型。');
    renderers[config.type](config.data);
    window.addEventListener('openai:set_globals', event => {
      activeHostRefresh?.();
      const candidate = event.detail?.globals?.widgetState;
      if (candidate === undefined || !activeRestore) return;
      const saved = stateEnvelope(candidate);
      if (saved !== null) activeRestore(saved);
    });
  } catch (error) {
    if (resizeObserver) resizeObserver.disconnect();
    root.replaceChildren();
    const message = el('p', 'cui-error', '组件未显示：' + (error instanceof Error ? error.message : '请检查配置。'));
    message.setAttribute('role', 'alert'); root.append(message);
  }
})();
</script>
