  const append = (node, ...children) => { children.filter(Boolean).forEach(child => node.append(child)); return node; };
  const text = value => typeof value === 'string' ? value : '';
  const number = value => typeof value === 'number' && Number.isFinite(value);
  const require = (test, message) => { if (!test) throw new Error(message); };
  const list = value => Array.isArray(value) ? value : [];
  const tone = (node, name) => {
    node.style.setProperty('--cui-tone', colors[name] || colors.blue);
    node.style.setProperty('--cui-mark', marks[name] || marks.blue);
    return node;
  };
  const badge = (label, color = 'blue') => tone(el('span', 'cui-badge', label), color);
  const paragraph = (value, className = '') => value ? el('p', className, value) : null;
  const heading = () => config.title ? el('h3', 'cui-title', config.title) : null;
  const panel = () => el('section', 'cui-panel cui-stack');
  const finiteFormat = value => new Intl.NumberFormat('zh-CN', {
    maximumFractionDigits: 2,
    notation: value !== 0 && (Math.abs(value) < .01 || Math.abs(value) >= 1e6) ? 'scientific' : 'standard'
  }).format(value);
  const fingerprint = value => {
    const serialized = JSON.stringify(value);
    let hash = 2166136261;
    for (let i = 0; i < serialized.length; i++) hash = Math.imul(hash ^ serialized.charCodeAt(i), 16777619);
    return (hash >>> 0).toString(16) + ':' + serialized.length;
  };
  let identity = '';
  const stateEnvelope = candidate => {
    const state = candidate && candidate.privateContent && candidate.privateContent.chatui;
    return state && state.schemaVersion === 1 && state.identity === identity ? state.value : null;
  };
  const saveState = (value, modelContent) => {
    if (disposed) return;
    if (typeof window.openai?.setWidgetState !== 'function') return;
    const payload = { modelContent, privateContent: { chatui: { schemaVersion: 1, identity, value } } };
    if (JSON.stringify(payload).length > 15000) return;
    try { Promise.resolve(window.openai.setWidgetState(payload)).catch(() => {}); } catch (_) { /* State remains usable locally. */ }
  };
  // Shared attribute policy; parity is regression-tested.
  const MATH_ATTRIBUTES = {
    mathvariant: /^(normal|bold|italic|bold-italic|double-struck|script|bold-script|fraktur|bold-fraktur|sans-serif|bold-sans-serif|sans-serif-italic|sans-serif-bold-italic|monospace)$/,
    displaystyle: /^(true|false)$/, scriptlevel: /^[0-2]$/,
    stretchy: /^(true|false)$/, fence: /^(true|false)$/, separator: /^(true|false)$/,
    largeop: /^(true|false)$/, movablelimits: /^(true|false)$/, symmetric: /^(true|false)$/,
    accent: /^(true|false)$/, accentunder: /^(true|false)$/,
    columnalign: /^(left|center|right)( (left|center|right)){0,11}$/,
    rowalign: /^(top|center|bottom|baseline|axis)( (top|center|bottom|baseline|axis)){0,11}$/,
    notation: /^(updiagonalstrike|downdiagonalstrike|horizontalstrike|verticalstrike|box|circle|top|bottom|left|right)( (updiagonalstrike|downdiagonalstrike|horizontalstrike|verticalstrike|box|circle|top|bottom|left|right)){0,3}$/
  };
  const mathLengths = new Set(['width', 'height', 'depth', 'voffset', 'lspace', 'rspace', 'minsize', 'maxsize', 'mathsize', 'linethickness', 'rowspacing', 'columnspacing']);
  function validateMathAttributes(attrs) {
    require((attrs && typeof attrs === 'object' && !Array.isArray(attrs)) && Object.keys(attrs).length <= 12, '公式属性过多。');
    for (const [key, value] of Object.entries(attrs)) {
      require(typeof value === 'string' && value.length <= 160, '公式属性必须是有界文本。');
      if (Object.hasOwn(MATH_ATTRIBUTES, key)) require(MATH_ATTRIBUTES[key].test(value), '公式属性值不受支持。');
      else {
        require(mathLengths.has(key), '公式不能含 HTML、样式、链接或事件属性。');
        const lengths = value.split(' ');
        require(lengths.length <= 12 && lengths.every(part => {
          const match = part.match(/^(-?(?:\d+(?:\.\d+)?|\.\d+))(em|ex|px|%)?$/);
          return match && Math.abs(Number(match[1])) <= (match[2] === '%' ? 400 : match[2] === 'px' ? 64 : 4);
        }), '公式尺寸超出安全范围。');
      }
    }
  }
  const safeMath = (spec, depth = 0) => {
    require(depth < 16, '公式结构过深。');
    if (typeof spec === 'string') return el('mtext', '', spec, MATH_NS);
    require(spec && typeof spec === 'object', '公式缺少有效结构。');
    const allowed = new Set(['mrow', 'mi', 'mn', 'mo', 'mtext', 'mfrac', 'msup', 'msub', 'msubsup', 'msqrt', 'mroot', 'mover', 'munder', 'munderover', 'mstyle', 'mspace', 'mpadded', 'mtable', 'mtr', 'mtd', 'menclose']);
    require(allowed.has(spec.tag), '公式包含不支持的元素。');
    const node = el(spec.tag, '', undefined, MATH_NS);
    if (spec.attrs !== undefined) { validateMathAttributes(spec.attrs); Object.entries(spec.attrs).forEach(([key, value]) => node.setAttribute(key, value)); }
    if (typeof spec.text === 'string') node.textContent = spec.text;
    list(spec.children).forEach(child => node.append(safeMath(child, depth + 1)));
    return node;
  };
  const formula = (spec, label) => {
    if (!spec) return null;
    const wrap = el('div', 'cui-math');
    const math = el('math', '', undefined, MATH_NS);
    math.setAttribute('display', 'block');
    if (label) math.setAttribute('aria-label', label);
    math.append(safeMath(spec));
    return append(wrap, math);
  };
  const revealSteps = data => {
    const short = (value, maximum) => typeof value === 'string' && value.trim().length > 0 && value.length <= maximum;
    const items = list(data.items);
    require(items.length >= 1 && items.length <= 12, '逐步讲解需要一至十二个步骤。');
    const initialVisible = data.initialVisible === undefined ? 1 : data.initialVisible;
    require(Number.isInteger(initialVisible) && initialVisible >= 1 && initialVisible <= items.length, '初始展开数量必须在1与步骤总数之间。');
    items.forEach(item => {
      require(item && typeof item === 'object' && !Array.isArray(item), '每一步必须是内容对象。');
      require(short(item.title, 160) && short(item.detail, 6000), '每一步需要简短标题和有效说明。');
      require(item.mathLabel === undefined || short(item.mathLabel, 1000), '公式的朗读说明应为简短文本。');
      require(item.math === undefined || (item.math !== null && typeof item.math === 'object' && !Array.isArray(item.math)), '步骤公式需要有效的 MathML 结构。');
    });
    const clean = saved => ({ visible: Number.isInteger(saved?.visible) && saved.visible >= 1 && saved.visible <= items.length ? saved.visible : initialVisible });
    let state = clean(stateEnvelope(window.openai?.widgetState));
    const content = panel(); content.classList.add('cui-reveal');
    const status = el('p', 'cui-label cui-values');
    status.setAttribute('aria-live', 'polite');
    status.setAttribute('aria-atomic', 'true');
    status.setAttribute('data-reveal-status', '');
    const rail = el('ol', 'cui-rail');
    const rows = items.map((item, index) => {
      const row = el('li', 'cui-event');
      row.setAttribute('data-reveal-step', index + 1);
      const number = badge(index + 1, 'blue');
      number.setAttribute('aria-hidden', 'true');
      const body = el('div', 'cui-event-content');
      append(body, el('h4', 'cui-reveal-title', item.title), formula(item.math, item.mathLabel), paragraph(item.detail, 'cui-exploration-prose'));
      append(row, number, body);
      rail.append(row);
      return row;
    });
    const controls = el('div', 'cui-row cui-reveal-controls');
    controls.setAttribute('role', 'group');
    controls.setAttribute('aria-label', '逐步讲解控制');
    const button = (label, action) => {
      const node = el('button', 'cui-button', label); node.type = 'button';
      node.setAttribute('data-reveal-action', action); controls.append(node); return node;
    };
    const previous = button('退回上一步', 'previous');
    const next = button('展开下一步', 'next'); next.classList.add('cui-reveal-next');
    const reset = button('回到初始展开', 'reset');
    const apply = () => {
      rows.forEach((row, index) => {
        row.hidden = index >= state.visible;
        if (index === state.visible - 1) row.setAttribute('aria-current', 'step'); else row.removeAttribute('aria-current');
      });
      status.textContent = `已展开 ${state.visible} / ${items.length} 步；当前：${items[state.visible - 1].title}。`;
      status.setAttribute('data-visible', state.visible);
      previous.disabled = state.visible <= 1;
      next.disabled = state.visible >= items.length;
      next.textContent = state.visible >= items.length ? '已展开全部步骤' : '展开下一步';
      reset.disabled = state.visible === initialVisible;
    };
    const change = visible => {
      state.visible = visible; apply();
      saveState(state, { component: 'reveal-steps', contentId: config.contentId, revealed: state.visible, total: items.length, currentTitle: items[state.visible - 1].title });
    };
    previous.addEventListener('click', () => { if (state.visible > 1) change(state.visible - 1); });
    next.addEventListener('click', () => { if (state.visible < items.length) change(state.visible + 1); });
    reset.addEventListener('click', () => change(initialVisible));
    append(content, heading(), status, rail, controls, paragraph('展开数量表示当前显示的内容，不代表已经掌握。', 'cui-label'));
    root.append(content);
    activeRestore = saved => { state = clean(saved); apply(); };
    apply();
  };

  try {
    config = JSON.parse(configNode.textContent);
    require(config && config.schemaVersion === 1 && typeof config.contentId === 'string' && config.contentId.length > 0, '配置需要 schemaVersion: 1 和内容标识。');
    require(config.data && typeof config.data === 'object', '配置需要组件数据。');
    identity = config.contentId + ':' + fingerprint(config);
    const renderers = { 'reveal-steps': revealSteps };
    require(Object.hasOwn(renderers, config.type), '不支持的组件类型。');
    renderers[config.type](config.data);
    window.addEventListener('openai:set_globals', event => {
      activeHostRefresh?.();
      const candidate = event.detail?.globals?.widgetState;
      if (candidate === undefined || !activeRestore) return;
      const saved = stateEnvelope(candidate);
      if (saved !== null) activeRestore(saved);
    });
  } catch (error) {
    if (resizeObserver) resizeObserver.disconnect();
    root.replaceChildren();
    const message = el('p', 'cui-error', '组件未显示：' + (error instanceof Error ? error.message : '请检查配置。'));
    message.setAttribute('role', 'alert'); root.append(message);
  }
})();
</script>
