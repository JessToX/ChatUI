  const text = value => typeof value === 'string' ? value : '';
  const number = value => typeof value === 'number' && Number.isFinite(value);
  const require = (test, message) => { if (!test) throw new Error(message); };
  const list = value => Array.isArray(value) ? value : [];
  const tone = (node, name) => {
    node.style.setProperty('--cui-tone', colors[name] || colors.blue);
    node.style.setProperty('--cui-mark', marks[name] || marks.blue);
    return node;
  };
  const badge = (label, color = 'blue') => tone(el('span', 'cui-badge', label), color);
  const paragraph = (value, className = '') => value ? el('p', className, value) : null;
  const heading = () => config.title ? el('h3', 'cui-title', config.title) : null;
  const panel = () => el('section', 'cui-panel cui-stack');
  const finiteFormat = value => new Intl.NumberFormat('zh-CN', {
    maximumFractionDigits: 2,
    notation: value !== 0 && (Math.abs(value) < .01 || Math.abs(value) >= 1e6) ? 'scientific' : 'standard'
  }).format(value);
  const fingerprint = value => {
    const serialized = JSON.stringify(value);
    let hash = 2166136261;
    for (let i = 0; i < serialized.length; i++) hash = Math.imul(hash ^ serialized.charCodeAt(i), 16777619);
    return (hash >>> 0).toString(16) + ':' + serialized.length;
  };
  let identity = '';
  const stateEnvelope = candidate => {
    const state = candidate && candidate.privateContent && candidate.privateContent.chatui;
    return state && state.schemaVersion === 1 && state.identity === identity ? state.value : null;
  };
  const saveState = (value, modelContent) => {
    if (disposed) return;
    if (typeof window.openai?.setWidgetState !== 'function') return;
    const payload = { modelContent, privateContent: { chatui: { schemaVersion: 1, identity, value } } };
    if (JSON.stringify(payload).length > 15000) return;
    try { Promise.resolve(window.openai.setWidgetState(payload)).catch(() => {}); } catch (_) { /* State remains usable locally. */ }
  };
  const lineChart = data => {
    const points = list(data.points);
    require(points.length >= 2 && points.length <= 80, '折线图需要二至八十个数据点。');
    require(points.every(p => p && number(p.x) && number(p.y) && Math.abs(p.x) <= 1e12 && Math.abs(p.y) <= 1e12), '坐标必须是绝对值不超过 10¹² 的有限数值。');
    require(points.every((p, index) => index === 0 || p.x > points[index - 1].x), '横坐标必须严格递增，不能重复。');
    require(['xLabel', 'yLabel', 'seriesLabel'].every(key => text(data[key]).trim().length > 0 && data[key].length <= 80), '图表需要简短的横轴、纵轴和数据系列名称。');
    require(['xUnit', 'yUnit'].every(key => data[key] === undefined || (typeof data[key] === 'string' && data[key].length <= 24)), '单位应为简短文本。');
    const xName = data.xLabel + (data.xUnit ? ` (${data.xUnit})` : '');
    const yName = data.yLabel + (data.yUnit ? ` (${data.yUnit})` : '');
    const content = tone(el('section', 'cui-stack'), text(data.tone) || 'green');
    const svg = el('svg', 'cui-svg cui-chart', undefined, SVG_NS);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', `${text(config.title) || data.seriesLabel}；${xName}与${yName}，${points.length}个数据点。完整数值见下方数据表。`);
    const key = append(el('div', 'cui-chart-key'), el('span', 'cui-chart-swatch'), el('span', '', data.seriesLabel));
    key.firstChild.setAttribute('aria-hidden', 'true');
    const details = el('details', 'cui-data');
    details.append(el('summary', '', '查看图表数据'));
    const table = el('table');
    const headers = el('tr');
    [xName, yName].forEach(name => { const th = el('th', '', name); th.setAttribute('scope', 'col'); headers.append(th); });
    const body = el('tbody');
    points.forEach(p => body.append(append(el('tr'), el('td', '', String(p.x)), el('td', '', String(p.y)))));
    append(table, append(el('thead'), headers), body); details.append(table);
    append(content, heading(), paragraph(text(data.note), 'cui-muted'), key, svg, details); root.append(content);
    const node = (tag, attrs, value) => {
      const item = el(tag, '', value, SVG_NS);
      Object.entries(attrs).forEach(([name, val]) => item.setAttribute(name, String(val)));
      return item;
    };
    const tickFormat = value => {
      if (value === 0) return '0';
      if (Math.abs(value) >= 1e5 || Math.abs(value) < .001) return value.toExponential(2).replace(/\.?(0+)(?=e)/, '');
      return String(Number(value.toPrecision(4)));
    };
    const bounds = values => {
      const low = Math.min(...values), high = Math.max(...values);
      const span = high - low;
      const padding = span > 0 ? span * .08 : Math.max(Math.abs(low) * .12, 1);
      return [low - padding, high + padding];
    };
    const xBounds = bounds(points.map(p => p.x)), yBounds = bounds(points.map(p => p.y));
    const niceTicks = (domain, maximum) => {
      const [low, high] = domain;
      const rawStep = Math.max(Number.MIN_VALUE, (high - low) / maximum);
      const magnitude = 10 ** Math.floor(Math.log10(rawStep)) || Number.MIN_VALUE;
      const candidates = [1, 2, 5, 10, 20, 50];
      for (const factor of candidates) {
        const step = magnitude * factor;
        if (step < rawStep) continue;
        const first = Math.ceil(low / step), last = Math.floor(high / step);
        const count = last - first + 1;
        if (count < 1 || count > maximum) continue;
        const ticks = Array.from({ length: count }, (_, index) => (first + index) * step)
          .filter((value, index, all) => Number.isFinite(value) && value >= low && value <= high && (index === 0 || value > all[index - 1]));
        if (ticks.length > 0) return ticks.map(value => Object.is(value, -0) ? 0 : value);
      }
      // Subnormal or near-precision-limit domains still have finite endpoint ticks.
      return low === high ? [low] : [low, high];
    };
    const draw = () => {
      const width = Math.max(260, Math.floor(svg.getBoundingClientRect().width || root.getBoundingClientRect().width || 360));
      const xTicks = width < 480 ? 4 : 6, yTicks = 5;
      const xt = niceTicks(xBounds, xTicks);
      const yt = niceTicks(yBounds, yTicks);
      const left = Math.max(64, ...yt.map(v => tickFormat(v).length * 7 + 14));
      // Measure the actual axis font: Latin glyphs are not uniformly 7px wide.
      const measure = node('text', { class: 'axis-title', visibility: 'hidden', 'aria-hidden': 'true' });
      svg.append(measure);
      const labelWidth = value => {
        measure.textContent = value;
        return typeof measure.getComputedTextLength === 'function' ? measure.getComputedTextLength()
          : [...value].reduce((sum, character) => sum + (character.codePointAt(0) > 0x2e7f ? 13 : 7), 0);
      };
      const splitLabel = label => {
        const lines = []; let line = '';
        for (const character of label) {
          if (line && labelWidth(line + character) > width - 32) { lines.push(line); line = ''; }
          line += character;
        }
        if (line) lines.push(line);
        return lines;
      };
      const xLines = splitLabel(xName), yLines = splitLabel(yName);
      measure.remove();
      const top = yLines.length * 18 + 14;
      const plotHeight = width < 480 ? 210 : 270;
      const bottom = top + plotHeight;
      const height = bottom + 42 + xLines.length * 18;
      const right = width - 16;
      const projectX = value => left + 8 + ((value - xBounds[0]) / (xBounds[1] - xBounds[0])) * (right - left - 16);
      const projectY = value => bottom - 8 - ((value - yBounds[0]) / (yBounds[1] - yBounds[0])) * (bottom - top - 16);
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('width', String(width)); svg.setAttribute('height', String(height));
      svg.replaceChildren();
      append(svg, node('title', {}, text(config.title) || data.seriesLabel), node('desc', {}, `${data.seriesLabel}。横轴${xName}，纵轴${yName}。按输入数据点连线；不推断未提供的数据。`));
      svg.append(node('rect', { x: left, y: top, width: right - left, height: bottom - top, class: 'cui-chart-frame', 'data-chart-frame': '' }));
      const xAxis = node('text', { x: (left + right) / 2, y: bottom + 41, 'text-anchor': 'middle', class: 'axis-title', 'data-axis': 'x' });
      xLines.forEach((line, index) => xAxis.append(node('tspan', { x: width / 2, dy: index ? 18 : 0 }, line)));
      const yAxis = node('text', { x: 0, y: 14, class: 'axis-title', 'data-axis': 'y' });
      yLines.forEach((line, index) => yAxis.append(node('tspan', { x: 0, dy: index ? 18 : 0 }, line)));
      append(svg, xAxis, yAxis);
      yt.forEach(value => {
        const y = projectY(value);
        append(svg, node('line', { x1: left, y1: y, x2: right, y2: y, class: 'cui-chart-grid' }), node('text', { x: left - 11, y: y + 4, 'text-anchor': 'end', 'data-chart-tick': 'y' }, tickFormat(value)));
      });
      const tickLabels = [];
      xt.forEach((value, index) => {
        const x = projectX(value);
        const label = node('text', { x, y: bottom + 21, 'text-anchor': index === 0 ? 'start' : index === xt.length - 1 ? 'end' : 'middle', 'data-chart-tick': 'x' }, tickFormat(value));
        svg.append(label); tickLabels.push(label);
      });
      const line = node('polyline', { points: points.map(p => `${projectX(p.x)},${projectY(p.y)}`).join(' '), class: 'cui-chart-line', 'data-chart-line': '' });
      svg.append(line);
      points.forEach(p => {
        const marker = node('circle', { cx: projectX(p.x), cy: projectY(p.y), r: 5, class: 'cui-chart-point', 'data-chart-point': '', 'data-x': p.x, 'data-y': p.y });
        marker.setAttribute('data-tooltip', `${data.xLabel}: ${p.x}${data.xUnit ? ' ' + data.xUnit : ''} · ${data.yLabel}: ${p.y}${data.yUnit ? ' ' + data.yUnit : ''}`);
        svg.append(marker);
      });
      // Remove only optional interior tick labels when actual glyph bounds collide.
      let previous = tickLabels[0];
      tickLabels.slice(1).forEach((label, index) => {
        if (typeof label.getBBox !== 'function') return;
        const a = previous.getBBox(), b = label.getBBox();
        if (a.x + a.width + 4 > b.x) {
          if (index === tickLabels.length - 2 && previous !== tickLabels[0]) { previous.remove(); previous = label; }
          else if (index !== tickLabels.length - 2) label.remove();
        } else previous = label;
      });
    };
    if (typeof ResizeObserver === 'function') { resizeObserver = new ResizeObserver(draw); resizeObserver.observe(svg); }
    draw();
  };
  try {
    config = JSON.parse(configNode.textContent);
    require(config && config.schemaVersion === 1 && typeof config.contentId === 'string' && config.contentId.length > 0, '配置需要 schemaVersion: 1 和内容标识。');
    require(config.data && typeof config.data === 'object', '配置需要组件数据。');
    identity = config.contentId + ':' + fingerprint(config);
    const renderers = { 'line-chart': lineChart };
    require(Object.hasOwn(renderers, config.type), '不支持的组件类型。');
    renderers[config.type](config.data);
    window.addEventListener('openai:set_globals', event => {
      activeHostRefresh?.();
      const candidate = event.detail?.globals?.widgetState;
      if (candidate === undefined || !activeRestore) return;
      const saved = stateEnvelope(candidate);
      if (saved !== null) activeRestore(saved);
    });
  } catch (error) {
    if (resizeObserver) resizeObserver.disconnect();
    root.replaceChildren();
    const message = el('p', 'cui-error', '组件未显示：' + (error instanceof Error ? error.message : '请检查配置。'));
    message.setAttribute('role', 'alert'); root.append(message);
  }
})();
</script>
